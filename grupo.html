<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Menú de grupo · Restaurante Sol</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f1b16;--muted:#7d7468;--line:#e3dccf;--gold:#a8834a;--accent:#2b2620;--ok:#2f6b3f;--warn:#a2561a;--err:#b3261e;
  --shadow:0 1px 2px rgba(50,35,15,.06),0 6px 20px rgba(50,35,15,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--card:#201d18;--ink:#f1eadf;--muted:#b1a693;--line:#3a342b;--gold:#d2ad6c;--accent:#e9dfcf;--ok:#7cc08f;--warn:#e19a5c;--err:#f08b84;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Jost,system-ui,sans-serif;padding-bottom:100px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.hero{text-align:center;padding:30px 0 18px;position:relative}
.brand{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--muted)}
h1{font:600 40px/1.05 "Cormorant Garamond",serif;margin:10px 0 6px}
.when{font:italic 500 20px "Cormorant Garamond",serif;color:var(--gold)}
.who{margin-top:10px;font-size:15px;color:var(--muted)}
.lang{position:absolute;top:12px;right:12px;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
.lang button{all:unset;cursor:pointer;font-size:12px;padding:3px 9px;border-radius:99px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--bg)}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h2{font:600 24px/1.15 "Cormorant Garamond",serif;margin:0 0 6px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.muted{color:var(--muted)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--ok)}
.big{font:600 30px "Cormorant Garamond",serif}
.btn{border:0;border-radius:99px;background:var(--accent);color:var(--bg);font:600 15px Jost;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.sm{font-size:14px;padding:8px 14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.opt h3{margin:0 0 4px;font-size:16px}
.opt p{margin:0 0 10px}
.sec-t{font:600 12px Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;text-align:center}
.sec-s{text-align:center;font:italic 500 17px "Cormorant Garamond",serif;color:var(--muted);margin:-4px 0 8px}
.fixed{text-align:center;font:500 19px/1.35 "Cormorant Garamond",serif}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.choice.on{border-color:var(--gold)}
.choice .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.choice.on .dot{border-color:var(--gold)}
.choice.on .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold)}
.choice .nm{font:500 19px/1.3 "Cormorant Garamond",serif}
.tag{display:inline-block;font:600 12px Jost;color:var(--gold);margin-left:6px;white-space:nowrap}
.al{font-size:12px;color:var(--muted);margin-top:3px}
label.f{display:block;font-weight:500;margin:0 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar .wrap{display:flex;gap:12px;align-items:center;padding:0}
.bar .msg{flex:1;font-size:14px;color:var(--muted)}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{padding:10px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
.plist li .x{flex:1;min-width:0}
.plist li b{font-weight:600}
.plist .pk{font-size:13.5px;color:var(--muted)}
.plist .nt{font-size:13px;color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.row .nm{flex:1;font-size:14.5px}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:19px;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step output{width:26px;text-align:center;font-weight:600}
.tot{display:flex;gap:10px;padding:5px 0;font-size:14.5px}
.tot b{min-width:30px;text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.chip.ok{background:var(--ok);color:#fff}.chip.bad{background:var(--warn);color:#fff}
.center{text-align:center;padding:60px 16px;color:var(--muted)}
.err{color:var(--err);font-size:14px}
.ok{color:var(--ok)}
dialog{border:0;border-radius:16px;padding:0;width:min(600px,96vw);max-height:92vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .in{padding:16px}
.demo{background:#ffd54a;color:#3a2c00;text-align:center;font-size:13px;padding:4px}
</style>
</head>
<body>
<div id="app"><div class="center">Cargando…</div></div>
<dialog id="pd"><div class="in" id="pdBody"></div></dialog>

<script src="/grupos/api.js"></script>
<script src="/grupos/menu-card.js"></script>
<script>
(function () {
'use strict';
const API = window.GruposAPI, M = API.M;
const T = {
  es: {
    hello: n => `Hola, ${n}`, group: n => `Grupo de ${n} personas`, groupOf: o => `Grupo de ${o}`, closes: d => `Elección abierta hasta el ${d}.`,
    progress: (a, n) => `Han elegido ${a} de ${n}`, missing: n => `Faltan ${n}`, allDone: '¡Ya está todo el grupo!',
    howT: '¿Cómo queréis elegir?', howP: 'Podéis combinar las dos formas: lo que elija cada uno y lo que apuntes tú se suma.',
    o1T: 'Cada uno elige desde su móvil', o1P: 'Envía este enlace al grupo. Cada persona pone su nombre y elige sus platos; te llega aquí automáticamente.',
    o2T: 'Lo apunto yo', o2P: 'Envía el menú en imagen o PDF, pregunta a cada uno y anota abajo las cantidades.',
    shareWa: 'Enviar enlace por WhatsApp', copy: 'Copiar enlace', copied: 'Enlace copiado', email: 'Por email', img: 'Enviar menú (imagen)', pdf: 'Descargar PDF', making: 'Preparando…',
    shareMsg: (m, d, l) => `¡Hola! Para la comida del ${d} (${m}), elige aquí tus platos: ${l}`,
    peopleT: n => `Personas que ya han elegido (${n})`, nobody: 'Todavía nadie. Comparte el enlace o añade personas tú mismo.',
    addPerson: 'Añadir persona', edit: 'Editar', del: 'Borrar', delQ: n => `¿Borrar la elección de ${n}?`, byOrg: 'añadida por ti', byStaff: 'añadida por el restaurante',
    countsT: 'Cantidades que apuntas tú', countsP: n => `Para las personas que no están en la lista de arriba (quedan ${n}). Pon cuántos quieren cada plato.`,
    countsNotes: 'Alergias o peticiones de estas personas', save: 'Guardar cantidades', saved: 'Guardado', unsaved: 'Cambios sin guardar',
    totT: 'Resumen para el restaurante', of: (a, n) => `${a} / ${n}`,
    menuT: 'El menú', choose: 'A elegir uno', shared: 'Para compartir', drinks: 'Bebidas incluidas',
    yourName: 'Tu nombre', yourNamePh: 'Nombre y apellido', notes: 'Alergias o peticiones (opcional)', notesPh: 'Ej.: sin gluten, sin lactosa…',
    pick: (s) => `Elige tu ${s.toLowerCase()}`, needName: 'Escribe tu nombre', needPick: n => `Falta elegir ${n}`, ready: '¡Listo!',
    send: 'Enviar mi elección', saveP: 'Guardar', sending: 'Enviando…', cancel: 'Cancelar',
    gIntro: o => `<b>${esc(o)}</b> te ha invitado a elegir tu menú. Elige un plato de cada apartado; tu elección le llega a ${esc(o)} y al restaurante.`,
    thanks: '¡Gracias! Tu elección está guardada', thanksSub: o => `${o} y el restaurante ya la ven. Puedes cambiarla desde este enlace, en este móvil, hasta la fecha límite.`,
    another: 'Elegir para otra persona', anotherP: '¿Eliges también por alguien que no tiene móvil (pareja, niño…)?',
    change: 'Cambiar', delMine: 'Borrar', delMineQ: '¿Borrar esta elección? (por ejemplo, si al final no vienes)',
    closed: 'La elección ya está cerrada', closedSub: o => `Para cualquier cambio, habla con ${o || 'el organizador'} o con el restaurante.`,
    full: 'El grupo ya está completo', fullSub: o => `Ya han elegido todas las personas de la reserva. Si falta alguien, habla con ${o || 'el organizador'}.`,
    invalid: 'Este enlace no es válido', invalidSub: 'Revisa el mensaje que recibiste o contacta con el restaurante.',
    net: 'No hemos podido conectar. Revisa la conexión e inténtalo de nuevo.', sup: s => `+${s.toFixed(2)} €`, supTotal: s => `Suplementos: ${s.toFixed(2)} €`,
    priceNote: 'Menú cerrado: el precio por persona es el mismo para todos; solo los platos marcados con +€ tienen suplemento.'
  },
  ca: {
    hello: n => `Hola, ${n}`, group: n => `Grup de ${n} persones`, groupOf: o => `Grup de ${o}`, closes: d => `Tria oberta fins al ${d}.`,
    progress: (a, n) => `Han triat ${a} de ${n}`, missing: n => `Falten ${n}`, allDone: 'Ja hi és tot el grup!',
    howT: 'Com voleu triar?', howP: 'Podeu combinar les dues maneres: el que triï cadascú i el que apuntis tu se suma.',
    o1T: 'Cadascú tria des del mòbil', o1P: 'Envia aquest enllaç al grup. Cada persona posa el seu nom i tria els plats; et arriba aquí automàticament.',
    o2T: 'Ho apunto jo', o2P: 'Envia el menú en imatge o PDF, pregunta a cadascú i apunta a sota les quantitats.',
    shareWa: 'Enviar l’enllaç per WhatsApp', copy: 'Copiar l’enllaç', copied: 'Enllaç copiat', email: 'Per correu', img: 'Enviar el menú (imatge)', pdf: 'Descarregar PDF', making: 'Preparant…',
    shareMsg: (m, d, l) => `Hola! Per al dinar del ${d} (${m}), tria aquí els teus plats: ${l}`,
    peopleT: n => `Persones que ja han triat (${n})`, nobody: 'Encara ningú. Comparteix l’enllaç o afegeix persones tu mateix.',
    addPerson: 'Afegir persona', edit: 'Editar', del: 'Esborrar', delQ: n => `Esborrar la tria de ${n}?`, byOrg: 'afegida per tu', byStaff: 'afegida pel restaurant',
    countsT: 'Quantitats que apuntes tu', countsP: n => `Per a les persones que no són a la llista de dalt (en queden ${n}). Posa quantes volen cada plat.`,
    countsNotes: 'Al·lèrgies o peticions d’aquestes persones', save: 'Desar les quantitats', saved: 'Desat', unsaved: 'Canvis sense desar',
    totT: 'Resum per al restaurant', of: (a, n) => `${a} / ${n}`,
    menuT: 'El menú', choose: 'A triar un', shared: 'Per compartir', drinks: 'Begudes incloses',
    yourName: 'El teu nom', yourNamePh: 'Nom i cognom', notes: 'Al·lèrgies o peticions (opcional)', notesPh: 'Ex.: sense gluten, sense lactosa…',
    pick: (s) => `Tria el teu ${s.toLowerCase()}`, needName: 'Escriu el teu nom', needPick: n => `Falta triar ${n}`, ready: 'A punt!',
    send: 'Enviar la meva tria', saveP: 'Desar', sending: 'Enviant…', cancel: 'Cancel·lar',
    gIntro: o => `<b>${esc(o)}</b> t’ha convidat a triar el teu menú. Tria un plat de cada apartat; la teva tria arriba a ${esc(o)} i al restaurant.`,
    thanks: 'Gràcies! La teva tria està desada', thanksSub: o => `${o} i el restaurant ja la veuen. La pots canviar des d’aquest enllaç, en aquest mòbil, fins a la data límit.`,
    another: 'Triar per una altra persona', anotherP: 'Tries també per algú que no té mòbil (parella, nen…)?',
    change: 'Canviar', delMine: 'Esborrar', delMineQ: 'Esborrar aquesta tria? (per exemple, si al final no vens)',
    closed: 'La tria ja està tancada', closedSub: o => `Per a qualsevol canvi, parla amb ${o || 'l’organitzador'} o amb el restaurant.`,
    full: 'El grup ja està complet', fullSub: o => `Ja han triat totes les persones de la reserva. Si en falta alguna, parla amb ${o || 'l’organitzador'}.`,
    invalid: 'Aquest enllaç no és vàlid', invalidSub: 'Revisa el missatge que vas rebre o contacta amb el restaurant.',
    net: 'No hem pogut connectar. Revisa la connexió i torna-ho a provar.', sup: s => `+${s.toFixed(2)} €`, supTotal: s => `Suplements: ${s.toFixed(2)} €`,
    priceNote: 'Menú tancat: el preu per persona és el mateix per a tothom; només els plats marcats amb +€ tenen suplement.'
  }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let lang = (() => { let s = null; try { s = localStorage.getItem('grupos-lang'); } catch {} return s || ((navigator.language || '').startsWith('ca') ? 'ca' : 'es'); })();
if (!T[lang]) lang = 'es';
const t = () => T[lang];
const path = location.pathname, qs = new URLSearchParams(location.search);
const orgToken = (path.match(/\/m\/([0-9a-f]{32})/) || [])[1] || qs.get('m') || '';
const shareToken = (path.match(/\/e\/([0-9a-f]{32})/) || [])[1] || qs.get('e') || '';
const ORG = !!orgToken;
const app = document.getElementById('app');
const fmt = (iso, o) => { const s = new Intl.DateTimeFormat(lang === 'ca' ? 'ca-ES' : 'es-ES', { timeZone: 'UTC', ...o }).format(new Date(iso + 'T12:00:00Z')); return s.charAt(0).toUpperCase() + s.slice(1); };
const sTitle = s => M.tr(s, 'title', lang), dName = d => M.tr(d, 'name', lang);

let E = null;              // event (organizer view or group view)
let draft = null;          // person form: { id, key, name, picks, notes }
let counts = {}, countsNotes = '', countsDirty = false, mode = 'form', busy = false, error = '';

// Companion's own rows on this device (several when choosing for a partner/child too).
const mineKey = 'grupos-mine-' + shareToken;
const mineList = () => { try { return JSON.parse(localStorage.getItem(mineKey)) || []; } catch { return []; } };
const setMine = l => { try { localStorage.setItem(mineKey, JSON.stringify(l)); } catch {} };

// ---------- shared pieces ----------
function header() {
  return `${API.demo ? '<div class="demo">DEMO</div>' : ''}<header class="hero"><div class="wrap">
    <div class="lang" role="group" aria-label="Idioma">${['es', 'ca'].map(l => `<button data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>
    <div class="brand">Restaurante Sol</div>
    <h1>${esc(M.tr(E.menu, 'name', lang) || E.menu.name)}</h1>
    <div class="when">${fmt(E.date, { weekday: 'long', day: 'numeric', month: 'long' })}${E.time ? ` · ${esc(E.time)}` : ''}</div>
    <div class="who">${ORG ? `${esc(t().hello(E.organizer || ''))} · ${t().group(E.pax)}` : esc(t().groupOf(E.organizer || E.title))}</div>
  </div></header>`;
}
function fixedSections() {
  let h = '';
  for (const s of M.other(E.menu)) {
    h += `<div class="sec-t">${esc(sTitle(s))}</div>${s.mode === 'shared' ? `<div class="sec-s">${t().shared}</div>` : ''}`;
    h += s.dishes.map(d => `<div class="fixed">${esc(dName(d))}</div>`).join('');
  }
  const drinks = (lang === 'ca' && E.menu.ca && E.menu.ca.drinks) || E.menu.drinks;
  if (drinks) h += `<div class="sec-t">${t().drinks}</div><div class="fixed" style="font-style:italic">${esc(drinks)}</div>`;
  return h;
}
function priceLine() {
  if (E.menu.price == null) return '';
  return `<p class="muted" style="text-align:center;margin:10px 0 0;font-size:14px"><b style="color:var(--ink);font:600 22px 'Cormorant Garamond',serif">${Number(E.menu.price).toFixed(2)} €</b> ${esc((lang === 'ca' && E.menu.ca && E.menu.ca.price_label) || E.menu.price_label || '')}<br>${t().priceNote}</p>`;
}
// One person's form (choice cards) — used by the companion page and the organizer's dialog.
function personForm(withName = true) {
  let h = withName ? `<div class="card"><label class="f" for="nm">${t().yourName}</label><input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="${esc(t().yourNamePh)}" value="${esc(draft.name)}"></div>` : '';
  for (const s of M.choice(E.menu)) {
    h += `<div class="sec-t">${esc(sTitle(s))}</div><div class="sec-s">${t().choose}</div>`;
    h += s.dishes.map(d => {
      const al = M.allergens(d, lang);
      return `<div class="choice${draft.picks[s.id] === d.id ? ' on' : ''}" data-s="${esc(s.id)}" data-d="${esc(d.id)}" role="radio" aria-checked="${draft.picks[s.id] === d.id}" tabindex="0">
        <span class="dot"></span><div><div class="nm">${esc(dName(d))}${d.supplement ? `<span class="tag">${t().sup(d.supplement)}</span>` : ''}</div>${al.length ? `<div class="al">${esc(al.join(' · '))}</div>` : ''}</div></div>`;
    }).join('');
  }
  h += `<div class="card"><label class="f" for="pn">${t().notes}</label><textarea id="pn" maxlength="300" placeholder="${esc(t().notesPh)}">${esc(draft.notes)}</textarea></div>`;
  return h;
}
function formProblem() {
  if (!draft.name.trim()) return t().needName;
  const miss = M.choice(E.menu).find(s => !draft.picks[s.id]);
  return miss ? t().needPick(sTitle(miss).toLowerCase()) : '';
}
function picksText(picks) {
  return M.choice(E.menu).map(s => { const d = M.dish(E.menu, s.id, picks[s.id]); return d ? dName(d) : '—'; }).join(' · ');
}
function renderMsg(title, sub) { app.innerHTML = `<div class="center"><h2 style="color:var(--ink);font:600 26px 'Cormorant Garamond',serif">${esc(title)}</h2><p>${esc(sub || '')}</p></div>`; }
const errText = e => e.code === 'closed' ? t().closed : e.code === 'full' ? t().full : e.code === 'invalid' ? formProblem() || t().net : t().net;

// ---------- companion page (/e/<share>) ----------
async function loadShare() {
  const mine = mineList(), first = mine[0];
  E = await API.getShare(shareToken, first && first.id, first && first.key);
  // Fetch every own row on this device (one call each; usually one or two).
  const rows = [];
  for (const r of mine) {
    const g = r === first ? E : await API.getShare(shareToken, r.id, r.key);
    if (g.mine) rows.push({ ...g.mine, key: r.key });
  }
  setMine(rows.map(r => ({ id: r.id, key: r.key })));
  E.myRows = rows;
}
async function initShare() {
  try { await loadShare(); }
  catch (e) { return renderMsg(e.code === 'network' ? t().net : t().invalid, e.code === 'network' ? '' : t().invalidSub); }
  if (!E.open) mode = 'closed';
  else if (E.myRows.length) mode = 'done';
  else if (E.taken >= E.pax) mode = 'full';
  else { draft = { id: null, key: null, name: '', picks: {}, notes: '' }; mode = 'form'; }
  render();
}
function renderShare() {
  if (mode === 'closed' || mode === 'full') {
    app.innerHTML = header() + `<main class="wrap"><div class="card"><h2>${mode === 'closed' ? t().closed : t().full}</h2>
      <p>${esc(mode === 'closed' ? t().closedSub(E.organizer) : t().fullSub(E.organizer))}</p>
      ${(E.myRows || []).map(r => `<p><b>${esc(r.name)}</b>: ${esc(picksText(r.picks))}</p>`).join('')}</div></main>`;
    document.body.style.paddingBottom = '30px'; return;
  }
  if (mode === 'done') {
    app.innerHTML = header() + `<main class="wrap"><div class="card"><h2 class="ok">${t().thanks}</h2><p>${esc(t().thanksSub(E.organizer || ''))}</p>
      <ul class="plist">${E.myRows.map(r => `<li><div class="x"><b>${esc(r.name)}</b><div class="pk">${esc(picksText(r.picks))}</div>${r.notes ? `<div class="nt">${esc(r.notes)}</div>` : ''}</div>
        <button class="btn sm ghost" data-mine-edit="${esc(r.id)}">${t().change}</button><button class="btn sm ghost" data-mine-del="${esc(r.id)}">${t().delMine}</button></li>`).join('')}</ul></div>
      ${E.taken < E.pax ? `<div class="card"><p>${t().anotherP}</p><button class="btn ghost" id="another">${t().another}</button></div>` : ''}
      <div class="card">${fixedSections()}${priceLine()}</div></main>`;
    document.body.style.paddingBottom = '30px'; return;
  }
  document.body.style.paddingBottom = '';
  app.innerHTML = header() + `<main class="wrap">
    <div class="card"><p style="margin:0">${t().gIntro(E.organizer || E.title)}</p>${E.deadline ? `<p style="margin:8px 0 0">${esc(t().closes(fmt(E.deadline, { day: 'numeric', month: 'long' })))}</p>` : ''}</div>
    ${personForm(true)}
    <div class="card">${fixedSections()}${priceLine()}</div>
    ${error ? `<p class="err">${esc(error)}</p>` : ''}
  </main><div class="bar"><div class="wrap"><div class="msg" id="msg"></div>${draft.id ? `<button class="btn ghost" id="cancelEdit">${t().cancel}</button>` : ''}<button class="btn" id="sendP"></button></div></div>`;
  updateBar();
}
function updateBar() {
  const msg = document.getElementById('msg'), btn = document.getElementById('sendP');
  if (!msg) return;
  const p = formProblem();
  msg.innerHTML = busy ? '' : p ? esc(p) : `<span class="ok" style="font-weight:600">${t().ready}</span>`;
  btn.textContent = busy ? t().sending : draft.id ? t().saveP : t().send;
  btn.disabled = busy || !!p;
}
async function sendShare() {
  if (busy || formProblem()) return;
  busy = true; updateBar(); error = '';
  try {
    const r = await API.savePerson(shareToken, draft.id, draft.key, draft.name, draft.picks, draft.notes);
    const l = mineList().filter(x => x.id !== r.id); l.push({ id: r.id, key: r.key }); setMine(l);
    busy = false; await initShare(); window.scrollTo(0, 0);
  } catch (e) { busy = false; if (e.code === 'closed' || e.code === 'full') { mode = e.code; return render(); } error = errText(e); render(); }
}

// ---------- organizer page (/m/<token>) ----------
async function initOrg() {
  try { E = await API.getOrg(orgToken); }
  catch (e) { return renderMsg(e.code === 'network' ? t().net : t().invalid, e.code === 'network' ? '' : t().invalidSub); }
  counts = JSON.parse(JSON.stringify(E.counts || {})); countsNotes = E.counts_notes || ''; countsDirty = false;
  render();
}
const shareLink = () => API.demo ? `${location.origin}/grupo.html?demo&e=${E.share_token}` : `${location.origin}/e/${E.share_token}`;
const ev4card = () => ({ menu: E.menu, date: E.date, time: E.time, organizer: E.organizer || '' });
function renderOrg() {
  document.body.style.paddingBottom = '30px';
  const totals = M.totals({ ...E, counts }), acc = M.accounted({ ...E, counts }), left = Math.max(0, E.pax - acc);
  const people = E.personas || [], open = E.open;
  const msg = t().shareMsg(M.tr(E.menu, 'name', lang) || E.menu.name, fmt(E.date, { day: 'numeric', month: 'long' }), shareLink());
  const mail = `mailto:?subject=${encodeURIComponent(M.tr(E.menu, 'name', lang) || E.menu.name)}&body=${encodeURIComponent(msg)}`;
  const freeForCounts = E.pax - people.length;
  let h = header() + `<main class="wrap">
    <div class="card"><div class="big">${t().progress(acc, E.pax)}</div>
      <div class="prog"><i style="width:${Math.min(100, acc / E.pax * 100)}%"></i></div>
      <p style="margin:0">${acc >= E.pax ? `<b class="ok">${t().allDone}</b>` : t().missing(E.pax - acc)}${E.deadline ? ` · ${esc(t().closes(fmt(E.deadline, { day: 'numeric', month: 'long' })))}` : ''}</p>
      ${!open ? `<p class="err" style="margin:8px 0 0">${esc(t().closed)}</p>` : ''}</div>`;
  if (open) h += `<div class="card"><h2>${t().howT}</h2><p>${t().howP}</p>
      <div class="opt"><h3>1 · ${t().o1T}</h3><p class="muted">${t().o1P}</p>
        <div class="acts"><a class="btn sm wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${t().shareWa}</a>
        <button class="btn sm ghost" id="copyL">${t().copy}</button><a class="btn sm ghost" href="${esc(mail)}">${t().email}</a></div></div>
      <div class="opt"><h3>2 · ${t().o2T}</h3><p class="muted">${t().o2P}</p>
        <div class="acts"><button class="btn sm" id="img">${t().img}</button><button class="btn sm ghost" id="pdf">${t().pdf}</button></div></div></div>`;
  h += `<div class="card"><h2>${t().peopleT(people.length)}</h2>
    ${people.length ? `<ul class="plist">${people.map(p => `<li><div class="x"><b>${esc(p.name)}</b> ${p.added_by !== 'self' ? `<span class="muted" style="font-size:12px">· ${p.added_by === 'staff' ? t().byStaff : t().byOrg}</span>` : ''}
      <div class="pk">${esc(picksText(p.picks))}</div>${p.notes ? `<div class="nt">${esc(p.notes)}</div>` : ''}</div>
      ${open ? `<button class="btn sm ghost" data-pedit="${esc(p.id)}">${t().edit}</button><button class="btn sm ghost" data-pdel="${esc(p.id)}">${t().del}</button>` : ''}</li>`).join('')}</ul>` : `<p>${t().nobody}</p>`}
    ${open && acc < E.pax ? `<p style="margin:10px 0 0"><button class="btn sm ghost" id="addP">+ ${t().addPerson}</button></p>` : ''}</div>`;
  if (open) {
    h += `<div class="card"><h2>${t().countsT}</h2><p>${t().countsP(Math.max(0, freeForCounts))}</p>`;
    for (const s of M.choice(E.menu)) {
      const m = counts[s.id] || {}, sum = Object.values(m).reduce((a, b) => a + b, 0);
      h += `<div class="sec-t" style="text-align:left;margin-top:14px">${esc(sTitle(s))} <span class="chip ${sum > freeForCounts ? 'bad' : ''}">${sum}</span></div>`;
      h += s.dishes.map(d => `<div class="row"><span class="nm">${esc(dName(d))}${d.supplement ? `<span class="tag">${t().sup(d.supplement)}</span>` : ''}</span>
        <span class="step"><button data-c="${esc(s.id)}|${esc(d.id)}" data-dd="-1" ${m[d.id] ? '' : 'disabled'}>−</button><output>${m[d.id] || 0}</output><button data-c="${esc(s.id)}|${esc(d.id)}" data-dd="1" ${sum >= freeForCounts ? 'disabled' : ''}>+</button></span></div>`).join('');
    }
    h += `<label class="f" for="cn" style="margin-top:14px">${t().countsNotes}</label><textarea id="cn" maxlength="1000">${esc(countsNotes)}</textarea>
      <p style="margin:10px 0 0;display:flex;gap:10px;align-items:center"><button class="btn" id="saveC" ${countsDirty ? '' : 'disabled'}>${t().save}</button>
      <span class="muted" id="cState">${countsDirty ? t().unsaved : E.counts_at ? t().saved : ''}</span></p>${error ? `<p class="err">${esc(error)}</p>` : ''}</div>`;
  }
  h += `<div class="card"><h2>${t().totT}</h2>`;
  for (const s of M.choice(E.menu)) {
    const m = totals[s.id] || {}, sum = Object.values(m).reduce((a, b) => a + b, 0);
    h += `<div class="sec-t" style="text-align:left;margin-top:12px">${esc(sTitle(s))} <span class="chip ${sum === E.pax ? 'ok' : ''}">${t().of(sum, E.pax)}</span></div>`;
    h += s.dishes.filter(d => m[d.id]).map(d => `<div class="tot"><b>${m[d.id]}</b><span>${esc(dName(d))}</span></div>`).join('');
  }
  const sup = M.supplements({ ...E, counts });
  if (sup) h += `<p style="margin:10px 0 0">${t().supTotal(sup)}</p>`;
  h += `</div><div class="card"><h2>${t().menuT}</h2>${M.choice(E.menu).map(s => `<div class="sec-t">${esc(sTitle(s))}</div><div class="sec-s">${t().choose}</div>${s.dishes.map(d => `<div class="fixed">${esc(dName(d))}${d.supplement ? `<span class="tag">${t().sup(d.supplement)}</span>` : ''}</div>`).join('')}`).join('')}${fixedSections()}${priceLine()}</div></main>`;
  app.innerHTML = h;
}
// Organizer: add or edit one person in a dialog.
const pd = document.getElementById('pd'), pdBody = document.getElementById('pdBody');
function openPerson(p) {
  draft = p ? { id: p.id, key: null, name: p.name, picks: { ...p.picks }, notes: p.notes || '' } : { id: null, key: null, name: '', picks: {}, notes: '' };
  renderPd(); pd.showModal();
}
function renderPd() {
  const p = formProblem();
  pdBody.innerHTML = `${personForm(true)}<p class="err" id="pdErr">${error ? esc(error) : ''}</p>
    <div class="acts" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" id="pdCancel">${t().cancel}</button><button class="btn" id="pdSave" ${p || busy ? 'disabled' : ''}>${busy ? t().sending : t().saveP}</button></div>
    <p class="muted" style="text-align:right;margin:6px 0 0;font-size:13px" id="pdMsg">${p ? esc(p) : ''}</p>`;
}
pd.addEventListener('click', async e => {
  const c = e.target.closest('.choice');
  if (c) { draft.picks[c.dataset.s] = c.dataset.d; const y = pd.scrollTop; renderPd(); pd.scrollTop = y; return; }
  if (e.target.id === 'pdCancel') { error = ''; pd.close(); return; }
  if (e.target.id === 'pdSave') {
    busy = true; renderPd();
    try { await API.savePerson(orgToken, draft.id, null, draft.name, draft.picks, draft.notes); busy = false; error = ''; pd.close(); await initOrg(); }
    catch (x) { busy = false; error = errText(x); renderPd(); }
  }
});
pd.addEventListener('input', e => {
  if (e.target.id === 'nm') draft.name = e.target.value;
  if (e.target.id === 'pn') draft.notes = e.target.value;
  const p = formProblem(); document.getElementById('pdSave').disabled = !!p || busy; document.getElementById('pdMsg').textContent = p;
});

// ---------- events ----------
app.addEventListener('click', async e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('grupos-lang', lang); } catch {} return render(); }
  const c = e.target.closest('.choice');
  if (c && !ORG) { draft.picks[c.dataset.s] = c.dataset.d; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const id = e.target.id;
  if (id === 'sendP') return sendShare();
  if (id === 'cancelEdit') { mode = 'done'; error = ''; return render(); }
  if (id === 'another') { draft = { id: null, key: null, name: '', picks: {}, notes: '' }; mode = 'form'; render(); window.scrollTo(0, 0); return; }
  const me = e.target.closest('[data-mine-edit]');
  if (me) { const r = E.myRows.find(x => x.id === me.dataset.mineEdit); draft = { id: r.id, key: r.key, name: r.name, picks: { ...r.picks }, notes: r.notes || '' }; mode = 'form'; render(); window.scrollTo(0, 0); return; }
  const md = e.target.closest('[data-mine-del]');
  if (md) {
    if (!confirm(t().delMineQ)) return;
    const r = E.myRows.find(x => x.id === md.dataset.mineDel);
    try { await API.deletePerson(shareToken, r.id, r.key); } catch (x) { return alert(errText(x)); }
    setMine(mineList().filter(x => x.id !== r.id)); return initShare();
  }
  // organizer
  if (id === 'copyL') { try { await navigator.clipboard.writeText(shareLink()); e.target.textContent = t().copied; } catch { prompt(t().copy, shareLink()); } return; }
  if (id === 'img' || id === 'pdf') {
    const b = e.target, lab = b.textContent; b.disabled = true; b.textContent = t().making;
    try { id === 'img' ? await GruposMenuCard.shareImage(ev4card(), { lang }, M.tr(E.menu, 'name', lang) || E.menu.name) : await GruposMenuCard.downloadPdf(ev4card(), { lang }); }
    catch { alert(t().net); }
    b.disabled = false; b.textContent = lab; return;
  }
  if (id === 'addP') return openPerson(null);
  const pe = e.target.closest('[data-pedit]'); if (pe) return openPerson(E.personas.find(p => p.id === pe.dataset.pedit));
  const pdl = e.target.closest('[data-pdel]');
  if (pdl) {
    const p = E.personas.find(x => x.id === pdl.dataset.pdel);
    if (!confirm(t().delQ(p.name))) return;
    try { await API.deletePerson(orgToken, p.id, null); } catch (x) { return alert(errText(x)); }
    return initOrg();
  }
  const st = e.target.closest('[data-c]');
  if (st) {
    const [sid, did] = st.dataset.c.split('|'), m = counts[sid] = counts[sid] || {};
    m[did] = Math.max(0, (m[did] || 0) + Number(st.dataset.dd)); if (!m[did]) delete m[did]; if (!Object.keys(m).length) delete counts[sid];
    countsDirty = true; error = ''; const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (id === 'saveC') {
    e.target.disabled = true;
    try { E = await API.saveCounts(orgToken, counts, countsNotes); counts = JSON.parse(JSON.stringify(E.counts || {})); countsDirty = false; error = ''; }
    catch (x) { error = errText(x); }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
});
app.addEventListener('keydown', e => { const c = e.target.closest('.choice'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.click(); } });
app.addEventListener('input', e => {
  if (e.target.id === 'nm') { draft.name = e.target.value; updateBar(); }
  if (e.target.id === 'pn') draft.notes = e.target.value;
  if (e.target.id === 'cn') { countsNotes = e.target.value; countsDirty = true; const b = document.getElementById('saveC'); if (b) b.disabled = false; const s = document.getElementById('cState'); if (s) s.textContent = t().unsaved; }
});

function render() {
  document.documentElement.lang = lang;
  if (!E) return;
  ORG ? renderOrg() : renderShare();
}
if (ORG) initOrg(); else if (shareToken) initShare(); else renderMsg(T[lang].invalid, T[lang].invalidSub);
})();
</script>
</body>
