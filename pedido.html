<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Menú de Fiestas · Restaurant Sol</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ea;--card:#fffdf9;--ink:#2a211b;--muted:#7a6c60;--line:#e6dccd;--accent:#9e2a2b;--accent-ink:#fff;--gold:#b8893b;--ok:#2f6b3f;--warn:#a2561a;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
:root[data-theme-day=esteve]{--accent:#2f5d46}
:root[data-theme-day=nuevo]{--accent:#1f3557}
:root[data-theme-day=reyes]{--accent:#5b3474}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17130f;--card:#221c17;--ink:#f2e9dd;--muted:#b3a593;--line:#3a3028;--gold:#d6aa5c;--ok:#7cc08f;--warn:#e19a5c;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Jost,system-ui,sans-serif;padding-bottom:110px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.hero{background:var(--accent);color:var(--accent-ink);padding:28px 0 26px;text-align:center}
.brand{letter-spacing:.24em;text-transform:uppercase;font-size:12px;opacity:.85}
h1{font:600 38px/1.05 "Cormorant Garamond",serif;margin:8px 0 4px}
.date{font-size:15px;opacity:.92}
.hello{margin-top:14px;font:italic 500 21px "Cormorant Garamond",serif}
.pax{display:inline-flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.pax span{background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px;font-size:14px}
.lang{position:absolute;top:12px;right:12px;display:flex;gap:2px;background:rgba(0,0,0,.18);border-radius:99px;padding:2px}
.lang button{all:unset;cursor:pointer;color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.28)}
.note{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
section{margin-top:26px}
h2{font:600 26px/1.1 "Cormorant Garamond",serif;margin:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.count{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.count.done{background:var(--ok);color:#fff}
.count.over{background:var(--warn);color:#fff}
.dish.other .ph.txt{font:600 30px Jost;color:var(--accent)}
.dish.other .name{font-weight:400;font-size:14.5px}
.dish.other .hint{font-size:12.5px;color:var(--muted);margin-top:3px}
textarea.need{border-color:var(--warn);outline:2px solid var(--warn)}
.group-title{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font:600 13px Jost;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pica{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.pica img{width:96px;height:96px;border-radius:10px;object-fit:cover;flex:none}
.pica ul{margin:0;padding-left:18px;font-size:14px}
.pica p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.dish{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .15s}
.dish.on{border-color:var(--accent)}
.dish .ph{width:84px;height:84px;border-radius:10px;flex:none;object-fit:cover;background:var(--line);cursor:zoom-in}
.dish .ph.txt{display:grid;place-items:center;font:italic 600 28px "Cormorant Garamond",serif;color:var(--muted);cursor:default}
.dish .info{flex:1;min-width:0}
.dish .name{font-weight:500;font-size:15.5px;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.firma{border-color:var(--gold);color:var(--gold)}
.tag.sup{border-color:var(--warn);color:var(--warn)}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button.plus{border-color:var(--accent);color:var(--accent)}
.step button:disabled{opacity:.28;cursor:default}
.step output{width:26px;text-align:center;font-weight:600;font-size:17px}
label.f{display:block;font-weight:500;margin:0 0 6px}
textarea{width:100%;min-height:76px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar .wrap{display:flex;gap:12px;align-items:center;padding:0}
.bar .msg{flex:1;font-size:14px;color:var(--muted)}
.btn{text-decoration:none;display:inline-block;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 16px Jost;padding:13px 22px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.center{text-align:center;padding:60px 16px;color:var(--muted)}
.done-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:22px}
.done-card h2{color:var(--ok)}
.sum h3{font:600 13px Jost;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.sum ul{margin:0;padding:0;list-style:none}
.sum li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum li b{min-width:28px;color:var(--accent)}
.err{color:#b3261e;font-size:14px;margin-top:8px}
dialog{border:0;padding:0;border-radius:16px;max-width:min(92vw,560px);background:transparent}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img{width:100%;display:block;border-radius:16px}
dialog p{color:#fff;text-align:center;font:italic 500 20px "Cormorant Garamond",serif;margin:10px 0 0}
.share-card{margin-top:18px;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.share-card h3{margin:0 0 4px;font:600 20px "Cormorant Garamond",serif}
.share-card p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.share-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{font-size:14px;padding:9px 16px}
.btn.wa{background:#1f9d55}
.gl{margin:12px 0 0;padding:0;list-style:none}
.gl li{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.gl b{font-weight:600}
.gl .pk{color:var(--muted);font-size:13px;margin-top:2px}
.who{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-top:18px}
.who input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.who input:focus{outline:2px solid var(--accent)}
.who .pp{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.who small{display:block;color:var(--muted);font-size:12.5px;margin-top:8px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-size:14px}
.demo{background:#ffd54a;color:#3a2c00;text-align:center;font-size:13px;padding:4px}
</style>
</head>
<body>
<div id="app"><div class="center">Cargando…</div></div>
<dialog id="zoom" onclick="this.close()"><img alt=""><p></p></dialog>

<script src="/fiestas/menus.js"></script>
<script src="/fiestas/api.js"></script>
<script>
(function () {
'use strict';
const F = window.FIESTAS, API = window.FiestasAPI;
const T = {
  es: {
    menu: 'Menú de', adults: n => `${n} ${n === 1 ? 'adulto' : 'adultos'}`, kids: n => `${n} ${n === 1 ? 'niño' : 'niños'}`,
    hello: n => `Hola, ${n}`,
    intro: (d, p, k) => `Elegid un primero, un segundo y un postre para cada comensal. <b>${p} €</b> por adulto${k ? `, menú infantil <b>${k} €</b>` : ''}. Os pedimos la elección antes del <b>${d}</b>.<br><span style="font-size:13px">Es un menú cerrado: el precio es el mismo aunque alguien tome media ración o no tome algún plato.</span>`,
    pica: 'Para compartir', picaNote: 'Pica-pica de bienvenida: una tabla para cada 4 personas, con pan.',
    adultsMenu: 'Menú', kidsMenu: 'Menú infantil', choose: (a, n) => `${a} / ${n}`,
    allergies: 'Alergias, intolerancias o peticiones especiales', allergiesPh: 'Ej.: una persona celíaca; la abuela no toma primer plato; media ración para un niño…',
    other: 'Otra opción / petición especial', otherHint: 'No tomar este plato, media ración, alergias… Describidlo abajo y lo confirmaremos con vosotros. El precio del menú no cambia.',
    needNote: 'Habéis elegido «otra opción»: contadnos qué necesitáis en el recuadro de peticiones especiales.',
    over: n => `Sobran ${n} ${n === 1 ? 'plato' : 'platos'}: revisad las cantidades`,
    comments: 'Comentarios (opcional)', commentsPh: 'Ej.: celebramos un cumpleaños',
    missing: n => `Faltan ${n} ${n === 1 ? 'plato' : 'platos'} por elegir`, ready: '¡Todo listo!',
    send: 'Enviar elección', resend: 'Guardar cambios', sending: 'Enviando…',
    thanks: '¡Gracias! Hemos recibido vuestra elección', thanksSub: 'Si cambiáis de idea, podéis modificarla desde este mismo enlace hasta la fecha indicada.',
    edit: 'Modificar elección', closed: 'La elección para este día ya está cerrada', confirmed: 'El restaurante ha confirmado vuestro pedido', confirmedSub: 'Hemos ajustado el pedido según lo que nos pedisteis. Si necesitáis cambiar algo más, llamadnos o escribidnos por WhatsApp.', closedSub: 'Si necesitáis cambiar algo, llamadnos o escribidnos por WhatsApp.',
    noOrderClosed: 'Todavía no habíamos recibido vuestra elección. Por favor, contactad con el restaurante.',
    invalidLink: 'Este enlace no es válido', invalidSub: 'Revisad el mensaje que os enviamos o contactad con el restaurante.',
    netErr: 'No hemos podido conectar. Revisad la conexión e intentadlo de nuevo.', invalidErr: 'Falta algún plato por elegir. Revisad la selección.',
    changed: 'El número de comensales de la reserva ha cambiado. Por favor, revisad y volved a enviar la elección.',
    supNote: s => `Suplemento +${s} € por plato`, sup: s => `+${s} €`, sent: 'Enviado el', allergiesL: 'Alergias', commentsL: 'Comentarios',
    // host: share with the group
    shareT: '¿Mesa grande? Que cada uno elija desde su móvil',
    shareP: 'Enviad este enlace a las demás familias o amigos de la mesa. Cada uno elige sus platos y aquí veréis todas las elecciones; después solo tenéis que revisar y enviar el pedido.',
    shareWa: 'Compartir por WhatsApp', copyLink: 'Copiar enlace', copied: 'Enlace copiado',
    shareMsg: (d, f, l) => `¡Hola! Para la comida de ${d} en ${F.restaurant} (${f}), elige aquí tus platos y los de tu familia: ${l}`,
    groupPicks: (a, n) => `Elecciones del grupo · ${a} de ${n} personas`, useGroup: 'Pasar estas elecciones al pedido', useGroupDone: 'Actualizar el pedido con el grupo',
    groupNew: 'Hay elecciones nuevas del grupo desde vuestro último envío.', filled: 'Hemos rellenado el pedido con las elecciones del grupo. Revisadlo, completad lo que falte y enviadlo.',
    // companion
    groupOf: h => `Mesa de ${h}`, tablePax: n => `Mesa de ${n} personas`,
    gIntro: h => `<b>${esc(h)}</b> os invita a elegir vuestros platos. Elegid para vosotros (por ejemplo, tu familia) y ${esc(h)} enviará el pedido de toda la mesa al restaurante.`,
    yourName: 'Tu nombre', yourNamePh: 'Ej.: Marta (familia Soler)', forHowMany: '¿Para cuántas personas eliges?',
    taken: (a, n, k, m) => `En el grupo ya han elegido ${a} de ${n} adultos${m ? ` y ${k} de ${m} niños` : ''}.`,
    needName: 'Escribe tu nombre para enviar', gSend: 'Enviar mi elección',
    gThanks: h => `¡Hecho! ${h} ya puede ver tu elección`, gThanksSub: 'Puedes cambiarla desde este mismo enlace, en este móvil, hasta que se cierre el pedido.',
    gDelete: 'Borrar mi elección', gDeleteQ: '¿Borrar tu elección? (por ejemplo, si al final no venís)', gDeleted: 'Tu elección se ha borrado.',
    gClosed: 'El pedido de esta mesa ya está cerrado', gClosedSub: h => `Para cualquier cambio, habla con ${h}.`, notesG: 'Alergias o peticiones especiales'
  },
  ca: {
    menu: 'Menú de', adults: n => `${n} ${n === 1 ? 'adult' : 'adults'}`, kids: n => `${n} ${n === 1 ? 'nen' : 'nens'}`,
    hello: n => `Hola, ${n}`,
    intro: (d, p, k) => `Trieu un primer, un segon i unes postres per a cada comensal. <b>${p} €</b> per adult${k ? `, menú infantil <b>${k} €</b>` : ''}. Us demanem la tria abans del <b>${d}</b>.<br><span style="font-size:13px">És un menú tancat: el preu és el mateix encara que algú prengui mitja ració o no prengui algun plat.</span>`,
    pica: 'Per compartir', picaNote: 'Pica-pica de benvinguda: una taula per cada 4 persones, amb pa.',
    adultsMenu: 'Menú', kidsMenu: 'Menú infantil', choose: (a, n) => `${a} / ${n}`,
    allergies: 'Al·lèrgies, intoleràncies o peticions especials', allergiesPh: 'Ex.: una persona celíaca; l’àvia no pren primer plat; mitja ració per a un nen…',
    other: 'Una altra opció / petició especial', otherHint: 'No prendre aquest plat, mitja ració, al·lèrgies… Expliqueu-ho a sota i ho confirmarem amb vosaltres. El preu del menú no canvia.',
    needNote: 'Heu triat «una altra opció»: expliqueu-nos què necessiteu al requadre de peticions especials.',
    over: n => `Sobren ${n} ${n === 1 ? 'plat' : 'plats'}: reviseu les quantitats`,
    comments: 'Comentaris (opcional)', commentsPh: 'Ex.: celebrem un aniversari',
    missing: n => `Falten ${n} ${n === 1 ? 'plat' : 'plats'} per triar`, ready: 'Tot a punt!',
    send: 'Enviar la tria', resend: 'Desar els canvis', sending: 'Enviant…',
    thanks: 'Gràcies! Hem rebut la vostra tria', thanksSub: 'Si canvieu d’idea, la podeu modificar des d’aquest mateix enllaç fins a la data indicada.',
    edit: 'Modificar la tria', closed: 'La tria per a aquest dia ja està tancada', confirmed: 'El restaurant ha confirmat la vostra comanda', confirmedSub: 'Hem ajustat la comanda segons el que ens vau demanar. Si necessiteu canviar alguna cosa més, truqueu-nos o escriviu-nos per WhatsApp.', closedSub: 'Si necessiteu canviar alguna cosa, truqueu-nos o escriviu-nos per WhatsApp.',
    noOrderClosed: 'Encara no havíem rebut la vostra tria. Si us plau, contacteu amb el restaurant.',
    invalidLink: 'Aquest enllaç no és vàlid', invalidSub: 'Reviseu el missatge que us vam enviar o contacteu amb el restaurant.',
    netErr: 'No hem pogut connectar. Reviseu la connexió i torneu-ho a provar.', invalidErr: 'Falta algun plat per triar. Reviseu la selecció.',
    changed: 'El nombre de comensals de la reserva ha canviat. Si us plau, reviseu i torneu a enviar la tria.',
    supNote: s => `Suplement +${s} € per plat`, sup: s => `+${s} €`, sent: 'Enviat el', allergiesL: 'Al·lèrgies', commentsL: 'Comentaris',
    shareT: 'Taula gran? Que cadascú triï des del seu mòbil',
    shareP: 'Envieu aquest enllaç a les altres famílies o amics de la taula. Cadascú tria els seus plats i aquí veureu totes les tries; després només heu de revisar i enviar la comanda.',
    shareWa: 'Compartir per WhatsApp', copyLink: 'Copiar l’enllaç', copied: 'Enllaç copiat',
    shareMsg: (d, f, l) => `Hola! Per al dinar de ${d} a ${F.restaurant} (${f}), tria aquí els teus plats i els de la teva família: ${l}`,
    groupPicks: (a, n) => `Tries del grup · ${a} de ${n} persones`, useGroup: 'Passar aquestes tries a la comanda', useGroupDone: 'Actualitzar la comanda amb el grup',
    groupNew: 'Hi ha tries noves del grup des del vostre últim enviament.', filled: 'Hem omplert la comanda amb les tries del grup. Reviseu-la, completeu el que falti i envieu-la.',
    groupOf: h => `Taula de ${h}`, tablePax: n => `Taula de ${n} persones`,
    gIntro: h => `<b>${esc(h)}</b> us convida a triar els vostres plats. Trieu per a vosaltres (per exemple, la teva família) i ${esc(h)} enviarà la comanda de tota la taula al restaurant.`,
    yourName: 'El teu nom', yourNamePh: 'Ex.: Marta (família Soler)', forHowMany: 'Per a quantes persones tries?',
    taken: (a, n, k, m) => `Al grup ja han triat ${a} de ${n} adults${m ? ` i ${k} de ${m} nens` : ''}.`,
    needName: 'Escriu el teu nom per enviar', gSend: 'Enviar la meva tria',
    gThanks: h => `Fet! ${h} ja pot veure la teva tria`, gThanksSub: 'La pots canviar des d’aquest mateix enllaç, en aquest mòbil, fins que es tanqui la comanda.',
    gDelete: 'Esborrar la meva tria', gDeleteQ: 'Esborrar la teva tria? (per exemple, si al final no veniu)', gDeleted: 'La teva tria s’ha esborrat.',
    gClosed: 'La comanda d’aquesta taula ja està tancada', gClosedSub: h => `Per a qualsevol canvi, parla amb ${h}.`, notesG: 'Al·lèrgies o peticions especials'
  }
};
let lang = (() => { let s = null; try { s = localStorage.getItem('fiestas-lang'); } catch {} return s || ((navigator.language || '').startsWith('ca') ? 'ca' : 'es'); })();
if (!T[lang]) lang = 'es';
const t = () => T[lang];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso, opts) => new Intl.DateTimeFormat(lang === 'ca' ? 'ca-ES' : 'es-ES', { timeZone: 'UTC', ...opts }).format(new Date(iso + 'T12:00:00Z'));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const token = (location.pathname.match(/\/p\/([0-9a-f]{32})/) || [])[1] || new URLSearchParams(location.search).get('t') || '';
const share = (location.pathname.match(/\/g\/([0-9a-f]{32})/) || [])[1] || new URLSearchParams(location.search).get('g') || '';
const GM = !token && !!share;   // companion ("group") mode
const mineKey = 'fiestas-g-' + share;
const loadMine = () => { try { return JSON.parse(localStorage.getItem(mineKey)) || null; } catch { return null; } };
const saveMine = v => { try { v ? localStorage.setItem(mineKey, JSON.stringify(v)) : localStorage.removeItem(mineKey); } catch {} };
const app = document.getElementById('app');

let B = null, day = null, sel = null, notes = { allergies: '', comments: '' }, mode = 'form', busy = false, error = '', info = '';
let G = null, me = null;   // group mode: group info and this companion's name / head count

const groups = () => [['adult', B.adults, day.menu], ['kid', B.kids, F.kids]].filter(g => g[1] > 0);
const sumC = (g, c) => Object.values(sel[g][c] || {}).reduce((a, b) => a + b, 0);
const missing = () => groups().reduce((m, [g, n]) => m + F.courses.reduce((x, c) => x + Math.max(0, n - sumC(g, c.id)), 0), 0);
const overBy = () => groups().reduce((m, [g, n]) => m + F.courses.reduce((x, c) => x + Math.max(0, sumC(g, c.id) - n), 0), 0);
const usesOther = () => groups().some(([g]) => F.courses.some(c => sel[g][c.id][F.OTHER]));
const needNote = () => usesOther() && !notes.allergies.trim();
const otherDish = () => ({ key: F.OTHER, es: t().other, other: true });
const courseList = (menu, c) => menu[c].concat([otherDish()]);
const countCls = (a, n) => a === n ? ' done' : a > n ? ' over' : '';
const emptySel = () => ({ adult: Object.fromEntries(F.courses.map(c => [c.id, {}])), kid: Object.fromEntries(F.courses.map(c => [c.id, {}])) });

async function initGroup() {
  const ref = loadMine();
  try { G = await API.getGroup(share, ref && ref.id, ref && ref.key); }
  catch (e) { return renderMsg(e.code === 'network' ? t().netErr : t().invalidLink, e.code === 'network' ? '' : t().invalidSub); }
  day = F.dayOf(G.day);
  if (!day) return renderMsg(t().invalidLink, t().invalidSub);
  document.documentElement.dataset.themeDay = day.theme;
  const m = G.mine;
  if (!m && ref) saveMine(null);
  me = { name: m ? m.name : '', adults: m ? m.adults : Math.min(1, G.adults), kids: m ? m.kids : 0 };
  B = { day: G.day, name: G.host, adults: me.adults, kids: me.kids, open: G.open,
        order: m ? { items: m.items, adults: m.adults, kids: m.kids, submitted_at: m.updated_at } : null };
  sel = emptySel();
  if (m) { for (const g of ['adult', 'kid']) for (const c of F.courses) sel[g][c.id] = { ...((m.items[g] || {})[c.id] || {}) }; notes.allergies = m.notes || ''; }
  mode = !G.open ? 'closed' : m ? 'done' : 'form';
  render();
}

async function init() {
  if (GM) return initGroup();
  try {
    B = await API.getBooking(token);
  } catch (e) {
    return renderMsg(e.code === 'network' ? t().netErr : t().invalidLink, e.code === 'network' ? '' : t().invalidSub);
  }
  day = F.dayOf(B.day);
  if (!day) return renderMsg(t().invalidLink, t().invalidSub);
  document.documentElement.dataset.themeDay = day.theme;
  sel = emptySel();
  const o = B.order;
  const sameHeads = o && o.adults === B.adults && o.kids === B.kids;
  if (o && sameHeads) {
    for (const g of ['adult', 'kid']) for (const c of F.courses) sel[g][c.id] = { ...((o.items[g] || {})[c.id] || {}) };
    notes = { allergies: o.allergies || '', comments: o.comments || '' };
    mode = 'done';
  } else if (o) {
    // Headcount changed: keep the previous picks so the family only adjusts the difference.
    const known = k => k === F.OTHER || F.dishIndex[k];
    for (const g of ['adult', 'kid']) for (const c of F.courses)
      sel[g][c.id] = Object.fromEntries(Object.entries((o.items[g] || {})[c.id] || {}).filter(([k]) => known(k)));
    notes = { allergies: o.allergies || '', comments: o.comments || '' }; error = t().changed;
  }
  if (!B.open) mode = 'closed';
  render();
}

function header() {
  const name = lang === 'ca' ? day.ca : day.name;
  return `${API.demo ? '<div class="demo">DEMO</div>' : ''}
  <header class="hero" style="position:relative">
    <div class="lang" role="group" aria-label="Idioma">${['es', 'ca'].map(l => `<button data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>
    <div class="wrap">
      <div class="brand">${esc(F.restaurant)}</div>
      <h1>${t().menu} ${esc(name)}</h1>
      <div class="date">${cap(fmtDate(day.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</div>
      <div class="hello">${esc(GM ? t().groupOf(G.host) : t().hello(B.name))}</div>
      <div class="pax">${GM ? `<span>${t().tablePax(G.adults + G.kids)}</span>` : `<span>${t().adults(B.adults)}</span>${B.kids ? `<span>${t().kids(B.kids)}</span>` : ''}`}</div>
    </div>
  </header>`;
}

function photo(d) {
  if (d.other) return '<div class="ph txt">✎</div>';
  return `<img class="ph" src="/fiestas/img/${esc(d.key)}.jpg" alt="${esc(d.es)}" loading="lazy" width="84" height="84" data-zoom="${esc(d.key)}" onerror="this.outerHTML='<div class=&quot;ph txt&quot;>${esc(d.es.charAt(0))}</div>'">`;
}

function dishRow(g, n, c, d) {
  const v = sel[g][c][d.key] || 0, full = sumC(g, c) >= n;
  const tags = (d.tags || []).map(x => x === 'sup' ? `<span class="tag sup">${t().sup(d.sup)}</span>` : `<span class="tag ${x}">${esc(F.tags[x][lang])}</span>`).join('');
  return `<div class="dish${v ? ' on' : ''}${d.other ? ' other' : ''}" data-g="${g}" data-c="${c}" data-k="${esc(d.key)}">
    ${photo(d)}
    <div class="info"><div class="name">${esc(d.es)}</div>${d.other ? `<div class="hint">${esc(t().otherHint)}</div>` : ''}${tags ? `<div class="tags">${tags}</div>` : ''}</div>
    <div class="step">
      <button type="button" class="minus" data-act="-" aria-label="−" ${v ? '' : 'disabled'}>−</button>
      <output aria-live="polite">${v}</output>
      <button type="button" class="plus" data-act="+" aria-label="+" ${full && n > 1 ? 'disabled' : ''}>+</button>
    </div>
  </div>`;
}

function renderForm() {
  const p = day.pica;
  let h = header() + `<main class="wrap">
    ${GM ? `<p class="note">${t().gIntro(G.host)}</p>` : ''}
    <p class="note">${t().intro(fmtDate(day.deadline, { day: 'numeric', month: 'long' }), day.price, (GM ? G.kids : B.kids) ? day.kidsPrice : 0)}</p>
    ${error ? `<p class="note" style="color:var(--warn)">${esc(error)}</p>` : ''}
    ${info ? `<p class="note" style="color:var(--ok)">${esc(info)}</p>` : ''}
    ${GM ? whoBlock() : shareCard(false)}
    <section><div class="sec-head"><h2>${t().pica}</h2></div>
      <div class="pica"><img src="/fiestas/img/${esc(p.key)}.jpg" alt="" data-zoom="${esc(p.key)}" style="cursor:zoom-in" onerror="this.remove()"><div><p>${t().picaNote}</p><ul>${p.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div></div>
    </section>`;
  for (const [g, n, menu] of groups()) {
    h += `<div class="group-title">${g === 'adult' ? `${t().adultsMenu} · ${t().adults(n)}` : `${t().kidsMenu} · ${t().kids(n)}`}</div>`;
    for (const c of F.courses) {
      const a = sumC(g, c.id);
      h += `<section><div class="sec-head"><h2>${esc(c[lang])}</h2><span class="count${countCls(a, n)}">${t().choose(a, n)}</span></div>
        ${courseList(menu, c.id).map(d => dishRow(g, n, c.id, d)).join('')}</section>`;
    }
  }
  h += `<section><label class="f" for="al">${GM ? t().notesG : t().allergies}</label>
      <textarea id="al" maxlength="${GM ? 500 : 1000}" class="${needNote() ? 'need' : ''}" placeholder="${esc(t().allergiesPh)}">${esc(notes.allergies)}</textarea></section>
    ${GM ? '' : `<section><label class="f" for="co">${t().comments}</label>
      <textarea id="co" maxlength="1000" placeholder="${esc(t().commentsPh)}">${esc(notes.comments)}</textarea></section>`}
    </main>
    <div class="bar"><div class="wrap"><div class="msg" id="msg"></div><button class="btn" id="send"></button></div></div>`;
  app.innerHTML = h;
  updateBar();
}

function whoBlock() {
  const step = (id, v, min, max) => `<div class="step"><button type="button" data-who="${id}" data-d="-1" ${v <= min ? 'disabled' : ''}>−</button><output>${v}</output><button type="button" class="plus" data-who="${id}" data-d="1" ${v >= max ? 'disabled' : ''}>+</button></div>`;
  return `<div class="who">
    <label class="f" for="nm">${t().yourName}</label><input id="nm" maxlength="60" autocomplete="name" placeholder="${esc(t().yourNamePh)}" value="${esc(me.name)}">
    <label class="f" style="margin-top:14px">${t().forHowMany}</label>
    <div class="pp"><span>${lang === 'ca' ? 'Adults' : 'Adultos'}</span>${step('adults', me.adults, me.kids ? 0 : 1, G.adults)}</div>
    ${G.kids ? `<div class="pp"><span>${t().kidsMenu}</span>${step('kids', me.kids, me.adults ? 0 : 1, G.kids)}</div>` : ''}
    <small>${esc(t().taken(G.taken_adults, G.adults, G.taken_kids, G.kids))}</small>
  </div>`;
}

const shareLink = () => API.demo ? `${location.origin}/pedido.html?demo&g=${B.share_token}` : `${location.origin}/g/${B.share_token}`;
function picksText(items) {
  return ['adult', 'kid'].map(g => F.courses.map(c => Object.entries(((items[g] || {})[c.id]) || {})
    .map(([k, n]) => `${n}× ${F.line(k)[lang]}`).join(', ')).filter(Boolean).join(' · ')).filter(Boolean).join(' · ');
}
function shareCard(inDone) {
  if (GM || !B.share_token || !B.open) return '';
  const sh = B.shares || [], pax = B.adults + B.kids;
  if (pax < 6 && !sh.length) return '';
  const got = sh.reduce((a, x) => a + x.adults + x.kids, 0);
  const fresh = B.order && sh.some(x => x.updated_at > B.order.submitted_at);
  const msg = t().shareMsg(lang === 'ca' ? day.ca : day.name, fmtDate(day.date, { weekday: 'long', day: 'numeric', month: 'long' }), shareLink());
  return `<div class="share-card">
    <h3>${t().shareT}</h3><p>${t().shareP}</p>
    <div class="share-acts"><a class="btn sm wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${t().shareWa}</a>
      <button type="button" class="btn sm ghost" id="copyG">${t().copyLink}</button></div>
    ${sh.length ? `<h3 style="font-size:18px;margin-top:16px">${t().groupPicks(got, pax)}</h3>
      ${fresh ? `<p style="color:var(--warn);margin:4px 0 0">${t().groupNew}</p>` : ''}
      <ul class="gl">${sh.map(x => `<li><b>${esc(x.name)}</b> · ${t().adults(x.adults)}${x.kids ? `, ${t().kids(x.kids)}` : ''}
        <div class="pk">${esc(picksText(x.items))}</div>${x.notes ? `<div class="pk" style="color:var(--warn)">${esc(x.notes)}</div>` : ''}</li>`).join('')}</ul>
      <p style="margin:12px 0 0"><button type="button" class="btn sm" id="useGroup">${inDone ? t().useGroupDone : t().useGroup}</button></p>` : ''}
  </div>`;
}
function fillFromGroup() {
  sel = emptySel();
  for (const x of B.shares || []) for (const g of ['adult', 'kid']) for (const c of F.courses)
    for (const [k, n] of Object.entries(((x.items[g] || {})[c.id]) || {})) sel[g][c.id][k] = (sel[g][c.id][k] || 0) + n;
  const lines = (B.shares || []).filter(x => x.notes).map(x => `${x.name}: ${x.notes}`).filter(l => !notes.allergies.includes(l));
  if (lines.length) notes.allergies = [notes.allergies.trim(), ...lines].filter(Boolean).join('\n');
  mode = 'form'; error = ''; info = t().filled; render(); window.scrollTo(0, 0);
}

function updateBar() {
  const m = missing(), o = overBy(), nn = needNote(), noName = GM && !me.name.trim(), msg = document.getElementById('msg'), btn = document.getElementById('send');
  if (!msg) return;
  msg.innerHTML = busy ? '' : o ? `<span style="color:var(--warn)">${esc(t().over(o))}</span>` : m ? esc(t().missing(m))
    : nn ? `<span style="color:var(--warn)">${esc(t().needNote)}</span>` : noName ? `<span style="color:var(--warn)">${esc(t().needName)}</span>`
    : `<span style="color:var(--ok);font-weight:600">${t().ready}</span>`;
  btn.textContent = busy ? t().sending : B.order ? t().resend : GM ? t().gSend : t().send;
  btn.disabled = busy || m > 0 || o > 0 || nn || noName;
  const al = document.getElementById('al'); if (al) al.classList.toggle('need', nn);
}

function summary() {
  let h = '<div class="sum">';
  for (const [g, n, menu] of groups()) {
    if (B.kids) h += `<h3 style="color:var(--ink)">${g === 'adult' ? t().adultsMenu : t().kidsMenu} · ${g === 'adult' ? t().adults(n) : t().kids(n)}</h3>`;
    for (const c of F.courses) {
      const order = menu[c.id].map(d => d.key);
      const keys = Object.keys(sel[g][c.id]).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
      h += `<h3>${esc(c[lang])}</h3><ul>${keys.map(k => { const L = F.line(k); return `<li><b>${sel[g][c.id][k]}×</b><span>${esc(L[lang])}${L.sup ? ` <span class="tag sup">${t().sup(L.sup)}</span>` : ''}</span></li>`; }).join('')}</ul>`;
    }
  }
  if (notes.allergies) h += `<h3>${t().allergiesL}</h3><p style="margin:0">${esc(notes.allergies)}</p>`;
  if (notes.comments) h += `<h3>${t().commentsL}</h3><p style="margin:0">${esc(notes.comments)}</p>`;
  return h + '</div>';
}

function renderDone() {
  const at = B.order && B.order.submitted_at ? new Date(B.order.submitted_at).toLocaleString(lang === 'ca' ? 'ca-ES' : 'es-ES', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
  app.innerHTML = header() + `<main class="wrap"><div class="done-card">
    <h2>${GM ? esc(t().gThanks(G.host)) : t().thanks}</h2><p style="color:var(--muted);margin:6px 0 0">${GM ? t().gThanksSub : t().thanksSub}</p>
    ${at ? `<p style="font-size:13px;color:var(--muted)">${t().sent} ${esc(at)}</p>` : ''}
    ${GM ? `<p style="margin:10px 0 0"><b>${esc(me.name)}</b> · ${t().adults(me.adults)}${me.kids ? `, ${t().kids(me.kids)}` : ''}</p>` : ''}
    ${summary()}
    <p style="text-align:center;margin:22px 0 4px"><button class="btn ghost" id="edit">${t().edit}</button></p>
    ${GM ? `<p style="text-align:center;margin:8px 0 0"><button class="linkbtn" id="gdel">${t().gDelete}</button></p>` : ''}
  </div>${shareCard(true)}</main>`;
  document.body.style.paddingBottom = '40px';
}

function renderClosed() {
  const has = B.order && B.order.adults === B.adults && B.order.kids === B.kids;
  if (GM) {
    app.innerHTML = header() + `<main class="wrap"><div class="done-card"><h2 style="color:var(--ink)">${t().gClosed}</h2>
      <p style="color:var(--muted);margin:6px 0 0">${esc(t().gClosedSub(G.host))}</p>${has ? summary() : ''}</div></main>`;
    document.body.style.paddingBottom = '40px'; return;
  }
  app.innerHTML = header() + `<main class="wrap"><div class="done-card">
    ${has && B.order.items.staff_at ? `<h2>${t().confirmed}</h2><p style="color:var(--muted);margin:6px 0 0">${t().confirmedSub}</p>`
      : `<h2 style="color:var(--ink)">${t().closed}</h2><p style="color:var(--muted);margin:6px 0 0">${has ? t().closedSub : t().noOrderClosed}</p>`}
    ${has ? summary() : ''}</div></main>`;
  document.body.style.paddingBottom = '40px';
}

function renderMsg(title, sub) {
  app.innerHTML = `<div class="center"><h2 style="color:var(--ink)">${esc(title)}</h2><p>${esc(sub)}</p></div>`;
}

function render() {
  document.documentElement.lang = lang;
  if (mode === 'closed') return renderClosed();
  if (mode === 'done') return renderDone();
  document.body.style.paddingBottom = '';
  renderForm();
}

// Re-render only one course block keeps the scroll position stable.
function refreshCourse(g, c) {
  const [, n, menu] = groups().find(x => x[0] === g);
  const first = app.querySelector(`.dish[data-g="${g}"][data-c="${c}"]`);
  const sec = first.closest('section');
  const a = sumC(g, c);
  sec.querySelector('.count').textContent = t().choose(a, n);
  sec.querySelector('.count').className = 'count' + countCls(a, n);
  sec.querySelectorAll('.dish').forEach(el => {
    const d = courseList(menu, c).find(x => x.key === el.dataset.k), v = sel[g][c][d.key] || 0;
    el.classList.toggle('on', v > 0);
    el.querySelector('output').textContent = v;
    el.querySelector('.minus').disabled = !v;
    el.querySelector('.plus').disabled = a >= n && n > 1;
  });
  updateBar();
}

function change(g, c, k, delta) {
  const n = g === 'adult' ? B.adults : B.kids, m = sel[g][c];
  if (delta > 0 && sumC(g, c) >= n) {
    if (n !== 1) return;
    for (const x in m) delete m[x];  // single diner: tapping another dish swaps it
  }
  m[k] = Math.max(0, (m[k] || 0) + delta);
  if (!m[k]) delete m[k];
  refreshCourse(g, c);
}

app.addEventListener('click', async e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('fiestas-lang', lang); } catch {} if (error) error = error === T.es.changed || error === T.ca.changed ? t().changed : error; return render(); }
  const z = e.target.closest('[data-zoom]');
  if (z) { const dlg = document.getElementById('zoom'); dlg.querySelector('img').src = z.src; dlg.querySelector('p').textContent = z.alt; dlg.showModal(); return; }
  const b = e.target.closest('.step button');
  const row = e.target.closest('.dish');
  if (row && (b || !e.target.closest('.step'))) {
    const { g, c, k } = row.dataset;
    if (b) return change(g, c, k, b.dataset.act === '+' ? 1 : -1);
    const n = g === 'adult' ? B.adults : B.kids;
    if (sumC(g, c) < n || n === 1) change(g, c, k, 1);
    return;
  }
  if (e.target.id === 'edit') {
    // Lines only the restaurant can set (half portions, off-menu dishes...) cannot be edited here.
    for (const g of ['adult', 'kid']) for (const c of F.courses)
      for (const k of Object.keys(sel[g][c.id])) if (k !== F.OTHER && !F.dishIndex[k]) delete sel[g][c.id][k];
    mode = 'form'; error = ''; render(); window.scrollTo(0, 0); return;
  }
  if (e.target.id === 'send') return send();
  const wb = e.target.closest('[data-who]');
  if (wb) {
    const f = wb.dataset.who, max = f === 'adults' ? G.adults : G.kids;
    me[f] = Math.max(0, Math.min(max, me[f] + Number(wb.dataset.d)));
    if (me.adults + me.kids < 1) me[f] = 1;
    B.adults = me.adults; B.kids = me.kids;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.id === 'copyG') {
    try { await navigator.clipboard.writeText(shareLink()); e.target.textContent = t().copied; } catch { prompt(t().copyLink, shareLink()); }
    return;
  }
  if (e.target.id === 'useGroup') return fillFromGroup();
  if (e.target.id === 'gdel') {
    if (!confirm(t().gDeleteQ)) return;
    const ref = loadMine();
    try { if (ref) await API.deleteGroup(share, ref.id, ref.key); } catch (err) { if (err.code === 'closed') { mode = 'closed'; return render(); } return alert(t().netErr); }
    saveMine(null); return renderMsg(t().gDeleted, '');
  }
});
app.addEventListener('input', e => {
  if (e.target.id === 'al') { notes.allergies = e.target.value; updateBar(); }
  if (e.target.id === 'co') notes.comments = e.target.value;
  if (e.target.id === 'nm') { me.name = e.target.value; updateBar(); }
});

async function send() {
  if (busy || missing() || overBy() || needNote()) return;
  busy = true; updateBar();
  if (GM && !me.name.trim()) return;
  const items = {};
  if (B.adults) items.adult = sel.adult;
  if (B.kids) items.kid = sel.kid;
  try {
    if (GM) {
      const ref = loadMine();
      const r = await API.submitGroup(share, ref && ref.id, ref && ref.key, me.name, me.adults, me.kids, items, notes.allergies);
      saveMine({ id: r.id, key: r.key });
      B.order = { items, adults: me.adults, kids: me.kids, submitted_at: new Date().toISOString() };
      busy = false; error = ''; mode = 'done'; render(); window.scrollTo(0, 0); return;
    }
    B = await API.submitOrder(token, items, notes.allergies, notes.comments);
    busy = false; error = ''; info = ''; mode = 'done'; render(); window.scrollTo(0, 0);
  } catch (err) {
    busy = false;
    if (err.code === 'closed') { B.open = false; mode = 'closed'; return render(); }
    updateBar();
    const p = document.createElement('div'); p.className = 'err';
    p.textContent = err.code === 'invalid' ? t().invalidErr : t().netErr;
    document.getElementById('msg').replaceChildren(p);
  }
}

init();
})();
</script>
</body>
</html>
