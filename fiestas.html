<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>节日订餐管理</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#22201d;--muted:#77706a;--line:#e4dfd7;--accent:#9e2a2b;--ok:#2f6b3f;--okbg:#e5f1e8;--warn:#a2561a;--warnbg:#fbeee0;--info:#2c5a8a;--infobg:#e4edf7;--wa:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161513;--card:#201e1b;--ink:#eeeae4;--muted:#a59d94;--line:#36322d;--okbg:#1f3326;--warnbg:#3a2a1a;--infobg:#1c2a3a;--ok:#7cc08f;--warn:#e19a5c;--info:#8ab6e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Jost,"Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.top h1{font-size:18px;margin:0;flex:1}
.demo{background:#ffd54a;color:#3a2c00;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.days button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;font:inherit}
.days button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.days b{display:block;font-size:15px}
.days small{opacity:.8;font-size:12px}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-weight:500;padding:9px 14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:#b3261e}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.search{max-width:220px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--bg)}
td.num,th.num{text-align:center}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:500}
.b-new{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b-sent{background:var(--infobg);color:var(--info)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.muted{color:var(--muted)}
.al{color:#b3261e;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.card h3 .tn{background:var(--accent);color:#fff;border-radius:6px;padding:0 7px;font-size:13px}
.course{margin-bottom:16px}
.course h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.row .n{font-size:20px;font-weight:600;min-width:42px;text-align:right}
.row .bar{height:6px;background:var(--accent);border-radius:3px;opacity:.75}
.row .name{flex:1}
.kv{margin:0;padding:0;list-style:none;font-size:13.5px}
.kv li{display:flex;gap:6px;padding:2px 0}
.kv li b{min-width:24px;text-align:right}
.sub{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:8px 0 2px}
.login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h2{margin:0 0 14px;font-size:18px}
.login label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h2{margin:0 0 12px;font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{font-size:13px;color:var(--muted);display:block}
.fgrid .full{grid-column:1/-1}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.locked{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
@media (max-width:720px){
  .hide-m{display:none}
  .top{flex-wrap:wrap;gap:8px}
  .top h1{flex:1 0 auto;white-space:nowrap}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:20px}
  .search{max-width:none;flex:1 1 100%;order:5}
  table.bk,table.bk tbody{display:block;background:none;border:0}
  table.bk thead{display:none}
  table.bk tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  table.bk td{border:0;padding:0}
  table.bk td:nth-child(1){min-width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-weight:600}
  table.bk td:nth-child(4){font-weight:600}
  table.bk td:nth-child(5){grid-column:2/-1}
  table.bk td:nth-child(6){grid-column:1/-1;margin-top:4px}
  table.bk .acts{justify-content:flex-start}
  table.bk .btn.wa{flex:1 1 100%;justify-content:center;padding:9px}
}
@media print{
  header,.tabs,.tools,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .card,.stat,table{border-color:#bbb;break-inside:avoid}
  .print-title{display:block!important;font-size:18px;font-weight:600;margin-bottom:8px}
}
.print-title{display:none}
.print-only{display:none}
@media print{.screen-only{display:none!important}.print-only{display:block!important}}
dialog.wide{width:min(760px,96vw)}
.oc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.oc.bad{border-color:var(--warn)}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.orow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.orow:last-of-type{border-bottom:0}
.orow .nm{font-size:13.5px;line-height:1.3}
.orow.spec .nm{color:var(--muted)}
.orow.pend .nm{color:var(--warn);font-weight:500}
.ost{display:flex;align-items:center;gap:3px}
.ost small{font-size:11px;color:var(--muted);width:26px;text-align:right}
.ost button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
.ost output{width:20px;text-align:center;font-weight:600}
.ost.off{visibility:hidden}
.addx{display:flex;gap:6px;margin-top:6px}
.addx input{flex:1}
.cnt{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg)}
.cnt.ok{background:var(--okbg);color:var(--ok)}
.cnt.bad{background:var(--warnbg);color:var(--warn)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px}
.chk input{width:auto}
.pend-line{color:var(--warn);font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg"><form method="dialog" id="bform">
  <h2 id="dlgTitle">新增订台</h2>
  <div class="fgrid">
    <label class="full">姓名 / 家庭名 *<input name="name" required maxlength="120" placeholder="Familia Puig"></label>
    <label>电话（WhatsApp）<input name="phone" inputmode="tel" maxlength="40" placeholder="612 345 678"></label>
    <label>桌号<input name="table_no" maxlength="20" placeholder="例如 7"></label>
    <label>大人 *<input name="adults" type="number" min="1" max="40" required value="2"></label>
    <label>小孩（儿童套餐）<input name="kids" type="number" min="0" max="30" value="0"></label>
    <label class="full">日期<select name="day"></select></label>
    <label class="full">内部备注（客人看不到）<textarea name="notes" rows="2" maxlength="1000" placeholder="例如：已付定金 100€"></textarea></label>
  </div>
  <div class="dlg-acts"><button class="btn" value="cancel" formnovalidate>取消</button><button class="btn primary" value="ok">保存</button></div>
</form></dialog>

<dialog id="oed" class="wide"><form method="dialog" id="oform">
  <h2 id="oTitle">修改点餐</h2>
  <p class="muted" style="margin:-6px 0 10px;font-size:13px">客人电话或留言提出的变化在这里改：半份、不要某道菜、菜单外的菜。每道菜的份数要正好等于人数才能保存。</p>
  <div id="oBody"></div>
  <label style="font-size:13px;color:var(--muted)">过敏 / 特殊需求（客人写的，可以修改）<textarea name="allergies" rows="2" maxlength="1000"></textarea></label>
  <label style="font-size:13px;color:var(--muted);display:block;margin-top:8px">留言<textarea name="comments" rows="2" maxlength="1000"></textarea></label>
  <label class="chk"><input type="checkbox" name="lock" checked> 保存后锁定这一桌：客人打开链接只能查看，不能再改（建议勾选，避免覆盖员工的修改）</label>
  <p id="oMsg" class="al" style="font-size:13px;margin:8px 0 0"></p>
  <div class="dlg-acts"><button class="btn" value="cancel" formnovalidate>取消</button><button class="btn primary" value="ok">保存点餐</button></div>
</form></dialog>

<dialog id="bulk"><form method="dialog" id="bulkForm">
  <h2>批量粘贴订台</h2>
  <p class="muted" style="margin:0 0 8px;font-size:13px">可以从 Excel 直接复制粘贴，一行一个家庭，列的顺序：<b>姓名、电话、大人、小孩、桌号</b>（用逗号或 Tab 分隔，小孩和桌号可以不填）。导入到当前选中的日期。</p>
  <textarea name="text" rows="9" placeholder="Familia Puig, 612345678, 4, 2, 7&#10;Marta Soler	655111222	2	0	3"></textarea>
  <p id="bulkPreview" class="muted" style="font-size:13px;margin:8px 0 0"></p>
  <div class="dlg-acts"><button class="btn" value="cancel" formnovalidate>取消</button><button class="btn primary" value="ok">导入</button></div>
</form></dialog>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/fiestas/menus.js"></script>
<script src="/fiestas/api.js"></script>
<script>
(function () {
'use strict';
const F = window.FIESTAS, API = window.FiestasAPI, root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDay = (iso, o) => new Intl.DateTimeFormat('zh-CN', { timeZone: 'UTC', ...o }).format(new Date(iso + 'T12:00:00Z'));
const fmtEs = (iso, o) => new Intl.DateTimeFormat('es-ES', { timeZone: 'UTC', ...o }).format(new Date(iso + 'T12:00:00Z'));
const state = { day: F.days[0].date, tab: 'list', all: [], q: '' };
try { const s = JSON.parse(localStorage.getItem('fiestas-staff-ui') || '{}'); if (F.dayOf(s.day)) state.day = s.day; if (s.tab) state.tab = s.tab; } catch {}
const remember = () => { try { localStorage.setItem('fiestas-staff-ui', JSON.stringify({ day: state.day, tab: state.tab })); } catch {} };

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

// ---------- helpers ----------
const linkFor = b => API.demo ? `${location.origin}/pedido.html?demo&t=${b.token}` : `${location.origin}/p/${b.token}`;
function waPhone(p) {
  let d = String(p || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2);
  else if (/^[679]\d{8}$/.test(d)) d = '34' + d;
  return /^\d{8,15}$/.test(d) ? d : '';
}
function waText(b) {
  const day = F.dayOf(b.day), pax = `${b.adults} ${b.adults === 1 ? 'adulto' : 'adultos'}${b.kids ? ` y ${b.kids} ${b.kids === 1 ? 'niño' : 'niños'}` : ''}`;
  return `¡Hola, ${b.name}! 🎄\n\nGracias por celebrar ${day.name} con nosotros en ${F.restaurant} el ${fmtEs(day.date, { weekday: 'long', day: 'numeric', month: 'long' })}.\n\n` +
    `Aquí tenéis el menú. Podéis elegir el primero, el segundo y el postre de cada comensal (${pax}):\n${linkFor(b)}\n\n` +
    `Os agradeceríamos la elección antes del ${fmtEs(day.deadline, { day: 'numeric', month: 'long' })}. ¡Hasta pronto!`;
}
const pendingOther = b => !!b.order && ['adult', 'kid'].some(g => F.courses.some(c => (((b.order.items[g] || {})[c.id]) || {})[F.OTHER]));
const staffEdited = b => !!(b.order && b.order.items.staff_at);
// Screen texts are Chinese; printouts and Excel are Spanish (kitchen and floor staff read Spanish).
const TX = {
  zh: { changed: '人数已变，需重填', pend: '有特殊需求待处理', staff: '员工已确认', ordered: '已点餐', sent: '已发送，未回复', fresh: '未发送',
    tables: '订台（家庭）', people: (a, k) => `总人数：大人 ${a} · 小孩 ${k}`, sentN: '已发送菜单', doneN: n => `已点餐（${n} 人）`, notYet: '还没点餐',
    persons: n => `共 ${n} 人`, half: n => `+ ${n} 个半份`, offMenu: '菜单外', none: '不要这道（不用做）', other: '其他需求，待员工确认',
    onlyDone: (d, p, n, list) => `⚠ 下面的数量只包括已点餐的 ${d} 桌。还有 ${p} 桌（${n} 人）没点餐：${list}`,
    pendTables: (n, list) => `⚠ 有 ${n} 桌选了“其他需求”，还需要员工确认后改成具体的菜（在订台名单点“改点餐”）：${list}`,
    tableOf: t => `（${t} 号桌）`, sep: '、', pica: 'Pica-pica 分享拼盘', picaSets: '套（每桌按每 4 人 1 套计算，含全部订台）',
    adultsMenu: n => `大人套餐 · ${n} 人`, kidsMenu: n => `儿童套餐 · ${n} 人`, allergiesT: n => `过敏 / 忌口 · ${n} 桌`, nothing: '暂无',
    tablePrefix: t => `${t} 号桌 · `, course: c => `${c.zh} ${c.es}`, sub: c => `${c.zh} · ${c.es}`,
    adults: '大人', kidsMenuShort: '儿童套餐', paxLine: (a, k, n, p) => `大人 ${a}${k ? ` · 小孩 ${k}` : ''} · 共 ${n} 人 · Pica-pica ${p} 套`,
    allergy: '⚠ 过敏：', sup: n => `补差价：${n} €`, staleOrder: '订台人数改过，客人之前点的已作废，需要重新提交。', noOrder: '还没收到点餐。', notes: '备注：',
    noBookings: '这一天还没有订台。', byPerson: '按人（来自客人分享的点餐链接，仅供上菜参考）', kidShort: '童' },
  es: { changed: 'Cambió el nº de personas', pend: 'Petición especial pendiente', staff: 'Confirmado por el restaurante', ordered: 'Pedido recibido', sent: 'Enviado, sin respuesta', fresh: 'No enviado',
    tables: 'Reservas', people: (a, k) => `Personas: ${a} adultos · ${k} niños`, sentN: 'Menús enviados', doneN: n => `Con pedido (${n} pers.)`, notYet: 'Sin pedido',
    persons: n => `${n} personas`, half: n => `+ ${n} media${n === 1 ? '' : 's'} ración${n === 1 ? '' : 'es'}`, offMenu: 'fuera de carta', none: 'Sin este plato (no preparar)', other: 'Otra opción, pendiente de confirmar',
    onlyDone: (d, p, n, list) => `⚠ Las cantidades incluyen solo las ${d} mesas con pedido. Faltan ${p} mesas (${n} personas): ${list}`,
    pendTables: (n, list) => `⚠ ${n} mesa(s) con petición especial pendiente: ${list}`,
    tableOf: t => ` (mesa ${t})`, sep: ', ', pica: 'Pica-pica para compartir', picaSets: 'tablas (1 por cada 4 personas, todas las reservas)',
    adultsMenu: n => `Menú adultos · ${n} personas`, kidsMenu: n => `Menú infantil · ${n} niños`, allergiesT: n => `Alergias / intolerancias · ${n} mesa(s)`, nothing: 'Ninguna',
    tablePrefix: t => `Mesa ${t} · `, course: c => c.es, sub: c => c.es,
    adults: 'Adultos', kidsMenuShort: 'Menú infantil', paxLine: (a, k, n, p) => `${a} adultos${k ? ` · ${k} niños` : ''} · ${n} personas · Pica-pica: ${p}`,
    allergy: '⚠ Alergias: ', sup: n => `Suplementos: ${n} €`, staleOrder: 'Cambió el número de personas: el pedido anterior no vale, falta el nuevo.', noOrder: 'Sin pedido todavía.', notes: 'Notas: ',
    noBookings: 'No hay reservas para este día.', byPerson: 'Por persona (según el enlace de grupo, orientativo)', kidShort: 'niños' }
};
const status = (b, lang = 'zh') => {
  const T = TX[lang];
  if (b.order && (b.order.adults !== b.adults || b.order.kids !== b.kids)) return ['warn', T.changed];
  if (pendingOther(b)) return ['warn', T.pend];
  if (staffEdited(b)) return ['ok', T.staff];
  if (b.order) return ['ok', T.ordered];
  if (b.sent_at) return ['sent', T.sent];
  return ['new', T.fresh];
};
const valid = b => b.order && b.order.adults === b.adults && b.order.kids === b.kids;
const dayBookings = () => state.all.filter(b => b.day === state.day)
  .sort((a, b) => (parseInt(a.table_no) || 1e9) - (parseInt(b.table_no) || 1e9) || String(a.table_no || '').localeCompare(String(b.table_no || '')) || a.name.localeCompare(b.name));
const dishName = (k, lang = 'zh') => { const L = F.line(k); return lang === 'zh' && (L.kind === 'none' || L.kind === 'otro') ? L.zh : L.es; };
const picaSets = b => Math.ceil((b.adults + b.kids) / 4);
function supTotal(b) {
  if (!valid(b)) return 0;
  let s = 0; for (const c of F.courses) for (const [k, n] of Object.entries((b.order.items.adult || {})[c.id] || {})) s += ((F.dishIndex[k] || {}).sup || 0) * n;
  return s;
}

// ---------- login ----------
function renderLogin(err) {
  root.innerHTML = `<div class="login"><h2>节日订餐管理 · 登录</h2>
    <p class="muted" style="font-size:13px;margin:0">用菜单系统的同一个账号登录。</p>
    <form id="lf"><label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    ${err ? `<p class="al" style="font-size:13px">${esc(err)}</p>` : ''}
    <p style="margin:16px 0 0"><button class="btn primary" style="width:100%;justify-content:center">登录</button></p></form>
    <p class="muted" style="font-size:12px;margin:14px 0 0">只想先看看效果？<a href="?demo">打开演示版</a>（数据只保存在本机浏览器）</p></div>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    try { await API.signIn(f.get('email'), f.get('password')); await load(); } catch (x) { renderLogin('登录失败：' + x.message); }
  };
}

async function load() {
  try { state.all = await API.listBookings(); }
  catch (e) { if (e.code === 'auth') return renderLogin('登录已过期，请重新登录'); root.innerHTML = `<div class="empty">读取数据失败：${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">重试</button></div>`; return; }
  render();
}

// ---------- shell ----------

      <div id="view"></div></main>`;

function statsHtml(bs, lang = 'zh') {
  const T = TX[lang], a = bs.reduce((s, b) => s + b.adults, 0), k = bs.reduce((s, b) => s + b.kids, 0);
  const done = bs.filter(valid), sent = bs.filter(b => b.sent_at || b.order);
  return `<div class="stats">
    <div class="stat"><div class="v">${bs.length}</div><div class="l">${T.tables}</div></div>
    <div class="stat"><div class="v">${a + k}</div><div class="l">${T.people(a, k)}</div></div>
    ${lang === 'zh' ? `<div class="stat"><div class="v">${sent.length}</div><div class="l">${T.sentN}</div></div>` : ''}
    <div class="stat"><div class="v" style="color:var(--ok)">${done.length}</div><div class="l">${T.doneN(done.reduce((s, b) => s + b.adults + b.kids, 0))}</div></div>
    <div class="stat"><div class="v" style="color:${bs.length - done.length ? 'var(--warn)' : 'inherit'}">${bs.length - done.length}</div><div class="l">${T.notYet}</div></div>
  </div>`;
}

}

// ---------- tab: kitchen ----------
function tally(bs, group) {
  const t = {}; for (const c of F.courses) t[c.id] = {};
  for (const b of bs.filter(valid)) for (const c of F.courses)
    for (const [k, n] of Object.entries(((b.order.items[group] || {})[c.id]) || {})) t[c.id][k] = (t[c.id][k] || 0) + n;
  return t;
}
function courseBlock(title, list, counts, total, lang) {
  const T = TX[lang], amount = d => (counts[d.key] || 0) + (counts[d.key + '~h'] || 0) / 2;
  const max = Math.max(1, ...list.map(amount));
  const custom = Object.keys(counts).filter(k => k.startsWith('x~') || (!F.dishIndex[k.replace(/~h$/, '')] && k !== 'none' && k !== F.OTHER));
  let h = list.map(d => {
    const n = counts[d.key] || 0, half = counts[d.key + '~h'] || 0;
    return `<div class="row"><span class="n">${n}</span><span class="name">${esc(d.es)}${d.sup ? ` <span class="badge b-warn">+${d.sup}€</span>` : ''}${half ? ` <span class="badge b-sent">${T.half(half)}</span>` : ''}<div class="bar" style="width:${amount(d) / max * 100}%"></div></span></div>`;
  }).join('');
  h += custom.map(k => `<div class="row"><span class="n">${counts[k]}</span><span class="name">${esc(F.line(k).es)} <span class="badge b-sent">${T.offMenu}</span></span></div>`).join('');
  if (counts.none) h += `<div class="row"><span class="n muted">${counts.none}</span><span class="name muted">${T.none}</span></div>`;
  if (counts[F.OTHER]) h += `<div class="row"><span class="n pend-line">${counts[F.OTHER]}</span><span class="name pend-line">${T.other}</span></div>`;
  return `<div class="course"><h3>${title} <span class="muted" style="font-weight:400;font-size:13px">${T.persons(total)}</span></h3>${h}</div>`;
}
const tableList = (bs, T) => bs.map(b => esc(b.name) + (b.table_no ? T.tableOf(esc(b.table_no)) : '')).join(T.sep);
function viewKitchen(day, bs, lang = 'zh') {
  const T = TX[lang], done = bs.filter(valid), pending = bs.filter(b => !valid(b));
  const ta = tally(bs, 'adult'), tk = tally(bs, 'kid');
  const ad = done.reduce((s, b) => s + b.adults, 0), kd = done.reduce((s, b) => s + b.kids, 0);
  const allergies = done.filter(b => b.order.allergies), pend = done.filter(pendingOther);
  let h = statsHtml(bs, lang) + (lang === 'zh' ? `<div class="tools noprint"><button class="btn primary" onclick="print()">打印后厨单（西班牙语）</button><button class="btn" id="exportCsv">导出 Excel（西班牙语）</button></div>` : '');
  if (pending.length) h += `<div class="locked">${T.onlyDone(done.length, pending.length, pending.reduce((s, b) => s + b.adults + b.kids, 0), tableList(pending, T))}</div>`;
  if (pend.length) h += `<div class="locked">${T.pendTables(pend.length, tableList(pend, T))}</div>`;
  h += `<div class="grid">
    <div class="card"><h3>${T.pica}</h3><div class="row"><span class="n">${bs.reduce((s, b) => s + picaSets(b), 0)}</span><span class="name">${T.picaSets}</span></div>
      <ul class="kv" style="margin-top:6px">${day.pica.items.map(i => `<li>· ${esc(i)}</li>`).join('')}</ul></div>
    <div class="card"><h3>${T.adultsMenu(ad)}</h3>${F.courses.map(c => courseBlock(T.course(c), day.menu[c.id], ta[c.id], ad, lang)).join('')}</div>
    ${kd || F.courses.some(c => Object.keys(tk[c.id]).length) ? `<div class="card"><h3>${T.kidsMenu(kd)}</h3>${F.courses.map(c => courseBlock(T.course(c), F.kids[c.id], tk[c.id], kd, lang)).join('')}</div>` : ''}
    <div class="card"><h3>${T.allergiesT(allergies.length)}</h3>${allergies.length ? allergies.map(b => `<p style="margin:0 0 8px"><b>${b.table_no ? T.tablePrefix(esc(b.table_no)) : ''}${esc(b.name)}</b><br><span class="al">${esc(b.order.allergies)}</span></p>`).join('') : `<p class="muted">${T.nothing}</p>`}</div>
  </div>`;
  return h;
}

// ---------- tab: tables ----------
function orderList(items, lang) {
  const T = TX[lang];
  return F.courses.map(c => {
    const m = (items || {})[c.id] || {};
    const lines = Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, n]) => { const L = F.line(k);
      return `<li class="${L.kind === 'otro' ? 'pend-line' : ''}"><b>${n}×</b><span>${esc(dishName(k, lang))}${L.sup ? ` <span class="badge b-warn">+${L.sup}€</span>` : ''}${L.kind === 'custom' ? ` <span class="badge b-sent">${T.offMenu}</span>` : ''}</span></li>`; }).join('');
    return `<div class="sub">${T.sub(c)}</div><ul class="kv">${lines}</ul>`;
  }).join('');
}
function viewTables(day, bs, lang = 'zh') {
  const T = TX[lang];
  if (!bs.length) return `<div class="empty">${T.noBookings}</div>`;
  return statsHtml(bs, lang) + (lang === 'zh' ? `<div class="tools noprint"><button class="btn primary" onclick="print()">打印按桌明细（西班牙语）</button><button class="btn" id="exportCsv">导出 Excel（西班牙语）</button></div>` : '') + `
  <div class="grid">${bs.map(b => {
    const [cls, label] = status(b, lang), sup = supTotal(b);
    return `<div class="card" data-id="${b.id}"><h3>${b.table_no ? `<span class="tn">${esc(b.table_no)}</span>` : ''}<span style="flex:1">${esc(b.name)}</span><span class="badge b-${cls}">${label}</span></h3>
      <div class="muted" style="font-size:13px">${T.paxLine(b.adults, b.kids, b.adults + b.kids, picaSets(b))}${b.phone && lang === 'zh' ? ` · ${esc(b.phone)}` : ''}</div>
      ${valid(b) ? `
        ${b.kids ? `<div class="sub" style="color:var(--ink);margin-top:10px">${T.adults}</div>` : ''}${orderList(b.order.items.adult, lang)}
        ${b.kids ? `<div class="sub" style="color:var(--ink);margin-top:10px">${T.kidsMenuShort}</div>${orderList(b.order.items.kid, lang)}` : ''}
        ${peopleBlock(b, lang)}
        ${b.order.allergies ? `<p class="al" style="margin:10px 0 0">${T.allergy}${esc(b.order.allergies)}</p>` : ''}
        ${b.order.comments ? `<p style="margin:6px 0 0;font-size:13px">💬 ${esc(b.order.comments)}</p>` : ''}
        ${sup ? `<p style="margin:6px 0 0;font-size:13px;color:var(--warn)">${T.sup(sup)}</p>` : ''}`
      : `<p class="muted" style="margin:10px 0 0">${b.order ? T.staleOrder : T.noOrder}</p>`}
      ${b.notes && lang === 'zh' ? `<p class="muted" style="margin:8px 0 0;font-size:12.5px">${T.notes}${esc(b.notes)}</p>` : ''}
      ${lang === 'zh' ? `<p class="noprint" style="margin:10px 0 0"><button class="btn sm" data-act="order">${b.order ? '改点餐' : '代客点餐'}</button></p>` : ''}
    </div>`;
  }).join('')}</div>`;
}
// Per-person picks from the group link (filled in by the group feature; empty otherwise).
function peopleBlock(b, lang) {
  const sh = b.shares || [];
  if (!sh.length) return '';
  const T = TX[lang];
  const picks = items => ['adult', 'kid'].map(g => F.courses.map(c => Object.entries(((items[g] || {})[c.id]) || {})
    .map(([k, n]) => `${n}× ${esc(dishName(k, lang))}`).join(', ')).filter(Boolean).join(' / ')).filter(Boolean).join(' · ');
  return `<div class="sub" style="color:var(--ink);margin-top:12px">${T.byPerson}</div>
    <ul class="kv">${sh.map(x => `<li style="display:block;padding:3px 0"><b>${esc(x.name)}</b> <span class="muted">(${x.adults}${x.kids ? ` + ${x.kids} ${T.kidShort}` : ''})</span>: ${picks(x.items)}${x.notes ? ` <span class="al">· ${esc(x.notes)}</span>` : ''}</li>`).join('')}</ul>`;
}

// ---------- CSV ----------
function specials(b) {
  const out = [];
  for (const g of ['adult', 'kid']) for (const c of F.courses)
    for (const [k, n] of Object.entries(((b.order.items[g] || {})[c.id]) || {}))
      if (F.line(k).kind !== 'dish') out.push(`${g === 'kid' ? 'Infantil ' : ''}${c.es}: ${n}× ${F.line(k).es}`);
  return out.join(' | ');
}
function exportCsv() {
  const day = F.dayOf(state.day), bs = dayBookings();
  const cols = [];
  for (const c of F.courses) for (const d of day.menu[c.id]) cols.push(['adult', c.id, d.key, `${c.es}: ${d.es}`]);
  for (const c of F.courses) for (const d of F.kids[c.id]) cols.push(['kid', c.id, d.key, `Infantil ${c.es}: ${d.es}`]);
  const head = ['Mesa', 'Nombre', 'Teléfono', 'Adultos', 'Niños', 'Estado', 'Pica-pica', ...cols.map(c => c[3]), 'Suplementos €', 'Especiales (medias, sin plato, fuera de carta)', 'Alergias', 'Comentarios'];
  const rows = bs.map(b => {
    const v = valid(b);
    return [b.table_no || '', b.name, b.phone || '', b.adults, b.kids, status(b, 'es')[1], picaSets(b),
      ...cols.map(([g, c, k]) => v ? ((b.order.items[g] || {})[c] || {})[k] || '' : ''), supTotal(b) || '', v ? specials(b) : '',
      v ? b.order.allergies || '' : '', v ? b.order.comments || '' : ''];
  });
  const totals = ['', 'TOTAL', '', bs.reduce((s, b) => s + b.adults, 0), bs.reduce((s, b) => s + b.kids, 0), '', bs.reduce((s, b) => s + picaSets(b), 0),
    ...cols.map((_, i) => rows.reduce((s, r) => s + (Number(r[7 + i]) || 0), 0)), '', '', '', ''];
  const csv = [head, ...rows, totals].map(r => r.map(x => { const s = String(x); return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `pedidos-${day.date}-${day.name.replace(/\s+/g, '-')}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- booking dialog ----------
const dlg = document.getElementById('dlg'), bform = document.getElementById('bform');
bform.day.innerHTML = F.days.map(d => `<option value="${d.date}">${fmtDay(d.date, { month: 'long', day: 'numeric' })} ${esc(d.zh)} · ${esc(d.name)}</option>`).join('');
let editing = null;
function openBooking(b) {
  editing = b || null;
  document.getElementById('dlgTitle').textContent = b ? '编辑订台' : '新增订台';
  for (const k of ['name', 'phone', 'table_no', 'notes']) bform[k].value = b ? b[k] || '' : '';
  bform.adults.value = b ? b.adults : 2; bform.kids.value = b ? b.kids : 0; bform.day.value = b ? b.day : state.day;
  dlg.showModal(); bform.name.focus();
}
bform.addEventListener('submit', async e => {
  if (!e.submitter || e.submitter.value !== 'ok') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(bform));
  const b = { id: editing && editing.id, day: f.day, name: f.name.trim(), phone: f.phone.trim(), table_no: f.table_no.trim(), notes: f.notes.trim(),
    adults: Math.max(1, parseInt(f.adults) || 1), kids: Math.max(0, parseInt(f.kids) || 0) };
  if (!b.name) return;
  if (editing && editing.order && (editing.adults !== b.adults || editing.kids !== b.kids) &&
      !confirm('这桌已经点过餐，改人数后需要调整点餐（员工直接改，或客人用原链接重新选）。确定修改人数吗？')) return;
  const headsChanged = editing && editing.order && (editing.adults !== b.adults || editing.kids !== b.kids);
  try { await API.saveBooking(b); dlg.close(); toast('已保存'); state.day = b.day; remember(); await load(); } catch (x) { return alert('保存失败：' + x.message); }
  if (headsChanged && confirm('人数改了。要现在直接帮客人调整点餐吗？\n（选“取消”则由客人用原来的链接重新选择）')) {
    const nb = state.all.find(x => x.id === b.id); if (nb) openOrder(nb);
  }
});

// ---------- bulk paste ----------
const bulk = document.getElementById('bulk'), bulkForm = document.getElementById('bulkForm');
function parseBulk(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(/\t|;|,(?=\s*\S)/).map(x => x.trim()))
    .filter(p => p[0] && !/^(nombre|姓名|name)$/i.test(p[0]))
    .map(p => ({ name: p[0], phone: p[1] || '', adults: parseInt(p[2]) || 0, kids: parseInt(p[3]) || 0, table_no: p[4] || '' }));
}
bulkForm.text.addEventListener('input', () => {
  const rows = parseBulk(bulkForm.text.value), bad = rows.filter(r => r.adults < 1);
  document.getElementById('bulkPreview').innerHTML = rows.length ? `识别到 ${rows.length} 个家庭，共 ${rows.reduce((s, r) => s + r.adults + r.kids, 0)} 人${bad.length ? `；<span class="al">${bad.length} 行缺少大人数量，不会导入：${bad.map(r => esc(r.name)).join('、')}</span>` : ''}` : '';
});
bulkForm.addEventListener('submit', async e => {
  if (!e.submitter || e.submitter.value !== 'ok') return;
  e.preventDefault();
  bulk.close();
  const rows = parseBulk(bulkForm.text.value).filter(r => r.adults >= 1);
  let ok = 0;
  for (const r of rows) { try { await API.saveBooking({ ...r, day: state.day }); ok++; } catch (e) { alert(`导入 ${r.name} 失败：${e.message}`); break; } }
  bulkForm.text.value = ''; document.getElementById('bulkPreview').textContent = '';
  toast(`已导入 ${ok} 个家庭`); await load();
});

// ---------- staff order editor ----------
const oed = document.getElementById('oed'), oform = document.getElementById('oform'), oBody = document.getElementById('oBody');
let oB = null, oItems = null;
const oGroups = () => [['adult', oB.adults, F.dayOf(oB.day).menu, '大人'], ['kid', oB.kids, F.kids, '儿童套餐']].filter(g => g[1] > 0);
const oSum = (g, c) => Object.values(oItems[g][c]).reduce((a, b) => a + b, 0);
function openOrder(b) {
  oB = b; oItems = { adult: {}, kid: {} };
  const heads = b.order && b.order.adults === b.adults && b.order.kids === b.kids;
  for (const g of ['adult', 'kid']) for (const c of F.courses) oItems[g][c.id] = { ...(b.order ? (((b.order.items[g] || {})[c.id]) || {}) : {}) };
  document.getElementById('oTitle').textContent = `${b.order ? '修改点餐' : '代客点餐'} · ${b.table_no ? b.table_no + ' 号桌 · ' : ''}${b.name}（大人 ${b.adults}${b.kids ? ' · 小孩 ' + b.kids : ''}）`;
  oform.allergies.value = b.order ? b.order.allergies || '' : '';
  oform.comments.value = b.order ? b.order.comments || '' : '';
  oform.lock.checked = true;
  document.getElementById('oMsg').textContent = b.order && !heads ? '订台人数改过：下面是客人按旧人数点的，请调整到和现在的人数一致。' : '';
  renderOrderBody(); oed.showModal();
}
function stepper(g, c, k, n, label) {
  return `<span class="ost"><small>${label || ''}</small><button type="button" data-ok="${esc(k)}" data-og="${g}" data-oc="${c}" data-d="-1">−</button><output>${n}</output><button type="button" data-ok="${esc(k)}" data-og="${g}" data-oc="${c}" data-d="1">+</button></span>`;
}
function renderOrderBody() {
  const top = oed.scrollTop;
  oBody.innerHTML = oGroups().map(([g, n, menu, gl]) => F.courses.map(c => {
    const m = oItems[g][c.id], a = oSum(g, c.id);
    const rows = menu[c.id].map(d => `<div class="orow"><span class="nm">${esc(d.es)}</span>${stepper(g, c.id, d.key, m[d.key] || 0, '整份')}${stepper(g, c.id, d.key + '~h', m[d.key + '~h'] || 0, '半份')}</div>`).join('')
      + Object.keys(m).filter(k => k.startsWith('x~') || (!F.dishIndex[k.replace(/~h$/, '')] && k !== 'none' && k !== F.OTHER)).map(k => `<div class="orow"><span class="nm">${esc(F.line(k).es)} <span class="badge b-sent">菜单外</span></span>${stepper(g, c.id, k, m[k])}<span class="ost off"></span></div>`).join('')
      + `<div class="orow spec"><span class="nm">不要这道</span>${stepper(g, c.id, 'none', m.none || 0)}<span class="ost off"></span></div>`
      + (m[F.OTHER] ? `<div class="orow pend"><span class="nm">其他需求（客人选的，请改成上面的具体选项后减到 0）</span>${stepper(g, c.id, F.OTHER, m[F.OTHER])}<span class="ost off"></span></div>` : '');
    return `<div class="oc${a !== n ? ' bad' : ''}"><div class="oh"><b>${oB.kids ? gl + ' · ' : ''}${c.zh} ${c.es}</b><span class="cnt ${a === n ? 'ok' : 'bad'}">${a} / ${n}</span></div>${rows}
      <div class="addx"><input placeholder="菜单外的菜，例如 Verduras a la brasa" maxlength="60" data-xg="${g}" data-xc="${c.id}"><button type="button" class="btn sm" data-addx="${g}|${c.id}">加 1 份</button></div></div>`;
  }).join('')).join('');
  oed.scrollTop = top;
}
oBody.addEventListener('click', e => {
  const st = e.target.closest('[data-ok]');
  if (st) {
    const m = oItems[st.dataset.og][st.dataset.oc], k = st.dataset.ok;
    m[k] = Math.max(0, (m[k] || 0) + Number(st.dataset.d));
    if (!m[k] && k !== F.OTHER) delete m[k];
    if (!m[k]) delete m[k];
    return renderOrderBody();
  }
  const ax = e.target.closest('[data-addx]');
  if (ax) {
    const [g, c] = ax.dataset.addx.split('|'), inp = ax.previousElementSibling, name = inp.value.trim().replace(/\s+/g, ' ');
    if (!name) { inp.focus(); return; }
    const k = 'x~' + name; oItems[g][c][k] = (oItems[g][c][k] || 0) + 1; renderOrderBody();
  }
});
oBody.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-xg]')) { e.preventDefault(); e.target.nextElementSibling.click(); } });
oform.addEventListener('submit', async e => {
  if (!e.submitter || e.submitter.value !== 'ok') return;
  e.preventDefault();
  const bad = [];
  for (const [g, n, , gl] of oGroups()) for (const c of F.courses) { const a = oSum(g, c.id); if (a !== n) bad.push(`${oB.kids ? gl + ' ' : ''}${c.zh}：${a} / ${n}`); }
  if (bad.length) { document.getElementById('oMsg').textContent = '份数和人数对不上：' + bad.join('；'); return; }
  const pend = oGroups().some(([g]) => F.courses.some(c => oItems[g][c.id][F.OTHER]));
  if (pend && !confirm('还有“其他需求”没有改成具体的菜，后厨单上会显示为待确认。仍然保存吗？')) return;
  const items = { adult: oItems.adult };
  if (oB.kids) items.kid = oItems.kid;
  try {
    await API.saveOrderAsStaff(oB, items, oform.allergies.value, oform.comments.value, !oform.lock.checked);
    oed.close(); toast('点餐已保存'); await load();
  } catch (x) { document.getElementById('oMsg').textContent = '保存失败：' + x.message; }
});

// ---------- events ----------
root.addEventListener('click', async e => {
  const el = e.target.closest('[data-day],[data-tab],[data-act],#add,#bulkBtn,#exportCsv,#lock,#logout,#resetDemo');
  if (!el) return;
  if (el.dataset.day) { state.day = el.dataset.day; remember(); return render(); }
  if (el.dataset.tab) { state.tab = el.dataset.tab; remember(); return render(); }
  if (el.id === 'add') return openBooking();
  if (el.id === 'bulkBtn') return bulk.showModal();
  if (el.id === 'exportCsv') return exportCsv();
  if (el.id === 'logout') { await API.signOut(); return renderLogin(); }
  if (el.id === 'resetDemo') { if (confirm('清空演示数据并重新生成示例？')) { API.resetDemo(); await load(); } return; }
  if (el.id === 'lock') {
    const locked = dayBookings().every(b => b.locked);
    if (!locked && !confirm('锁定后，这一天的客人不能再提交或修改点餐。确定截止吗？')) return;
    const ids = dayBookings().filter(b => locked ? !staffEdited(b) : true).map(b => b.id);
    await API.setLocked(ids, !locked); toast(locked ? '已重新开放（员工已确认的桌保持锁定）' : '已截止点餐'); return load();
  }
  const holder = el.closest('[data-id]'), id = holder && holder.dataset.id, b = state.all.find(x => x.id === id);
  if (!b) return;
  if (el.dataset.act === 'wa') { API.markSent(b.id).then(load).catch(() => {}); return; } // the link itself opens WhatsApp
  if (el.dataset.act === 'copy') { try { await navigator.clipboard.writeText(waText(b)); toast('已复制消息和链接，可以粘贴到 WhatsApp'); } catch { prompt('复制这个链接：', linkFor(b)); } return; }
  if (el.dataset.act === 'edit') return openBooking(b);
  if (el.dataset.act === 'order') return openOrder(b);
  if (el.dataset.act === 'unlock') {
    if (!confirm(`解锁后，${b.name} 可以通过链接重新提交点餐，会覆盖员工的修改。确定解锁吗？`)) return;
    await API.setLocked([b.id], false); toast('已解锁'); return load();
  }
  if (el.dataset.act === 'del') {
    if (!confirm(`删除 ${b.name} 的订台${b.order ? '和已提交的点餐' : ''}？删除后不能恢复。`)) return;
    try { await API.deleteBooking(b.id); toast('已删除'); await load(); } catch (x) { alert('删除失败：' + x.message); }
  }
});
root.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  const pos = e.target.selectionStart; render();
  const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
});
// Refresh when the tab regains focus (guests may have ordered meanwhile).
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.all.length && !dlg.open && !bulk.open && !oed.open) load(); });

(async () => { (await API.session()) ? load() : renderLogin(); })();
})();
</script>
</body>
</html>
