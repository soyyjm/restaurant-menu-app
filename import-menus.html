  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);

}

  const logEl = document.getElementById('log');
  btn.disabled = true;
  logEl.innerHTML = `Iniciando importación de ${menus.length} menús...\n\n`;

  let ok = 0, fail = 0;
  for (const menu of menus) {
    const { data, error } = await client.from('menus_cerrados').insert([menu]).select().single();
    if (error) {
      logEl.innerHTML += `<span class="err">❌  ${menu.name}\n   ${error.message}</span>\n`;
      console.error(menu.name, error);
      fail++;
    } else {
      logEl.innerHTML += `<span class="ok">✅  ${menu.name}</span>\n`;
      ok++;
    }
  }
  logEl.innerHTML += `\n<strong>Resultado: ${ok} insertados correctamente, ${fail} errores.</strong>\n`;
  btn.textContent = 'Importar de nuevo';
  btn.disabled = false;
}
</script>
</body>
</html>
