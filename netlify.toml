[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200

# Redirect old proxy path to new function (backward compatibility)
[[redirects]]
  from = "/api-proxy/*"
  to = "/.netlify/functions/translate"
  status = 200
# Festive pre-order: short guest links /p/<token> → pedido.html (the page reads the token from the path)
[[redirects]]
  from = "/p/*"
  to = "/pedido.html"
  status = 200

# Group menus: organizer link /m/<token>, personal link /e/<share_token> -> grupo.html
[[redirects]]
  from = "/m/*"
  to = "/grupo.html"
  status = 200

[[redirects]]
  from = "/e/*"
  to = "/grupo.html"
  status = 200
