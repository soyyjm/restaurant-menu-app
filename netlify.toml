[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200

# Redirect old proxy path to new function (backward compatibility)
[[redirects]]
  from = "/api-proxy/*"
  to = "/.netlify/functions/translate"
  status = 200
# Festive pre-order: short guest links /p/<token> → pedido.html (the page reads the token from the path)
[[redirects]]
  from = "/p/*"
  to = "/pedido.html"
  status = 200

# Group link for big tables: /g/<share_token> → pedido.html (companion mode)
[[redirects]]
  from = "/g/*"
  to = "/pedido.html"
  status = 200
